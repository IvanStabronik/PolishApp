dialogue:
  title_pl: Przystanki i czas odjazdu
  turns:
    - speaker: Mila
      text_pl: Przepraszam, który autobus jedzie do centrum?
    - speaker: Pasażer
      text_pl: Autobus numer osiem.
    - speaker: Mila
      text_pl: Na którym przystanku mam wysiąść?
    - speaker: Pasażer
      text_pl: Na czwartym, przy poczcie.
    - speaker: Mila
      text_pl: Dziękuję. O której odjeżdża autobus?
    - speaker: Pasażer
      text_pl: O dziewiątej dziesięć.
    - speaker: Mila
      text_pl: Rozumiem. Bardzo dziękuję.
key_lines:
  - text_pl: Który autobus jedzie do centrum?
    explanation_ru: >
      Вопрос о линии до цели. Który autobus + jedzie do + Gen —
      обычный старт у остановки.
  - text_pl: Na którym przystanku mam wysiąść?
    explanation_ru: >
      Спрашиваете, где выйти. Слушайте и номер остановки, и ориентир
      рядом (przy poczcie).
  - text_pl: Na czwartym, przy poczcie.
    explanation_ru: >
      Короткий ответ: порядковый номер + место. Держите оба куска —
      так проще не проехать мимо.
  - text_pl: O której odjeżdża autobus?
    explanation_ru: >
      Вопрос о точном времени отправления. В ответе часто O + час
      (O dziewiątej dziesięć).
pan_pani:
  summary_ru: >
    К незнакомому пассажиру — Przepraszam, pan/pani и спокойный тон.
    Три вопроса (линия, выход, время) + Dziękuję. Форма ty и резкое
    *Ej… / *Ty mi powiedz — не к незнакомцу на остановке.
  form: "Który autobus…? · Na którym przystanku…? · O której odjeżdża…?"
  examples_pl: &a1
    - Który autobus jedzie do centrum?
    - Na którym przystanku mam wysiąść?
    - O której odjeżdża autobus?
  counterexamples_pl:
    - "*Ty mi powiedz." # слишком свои
    - "*Daj mi to." # грубо к незнакомцу
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      Починайте з Przepraszam. Три питання тримайте цілими формулами —
      не збирайте «який автобус / на якій / о котрій» дослівно з української.
    rus: >
      Не говорите ty пассажиру. Учите три вопроса целиком: który autobus…
      / na którym przystanku… / o której… — без кальки «скажи мне».
    bel: >
      Не калькуйце «скажы мне» ў *Ty mi powiedz. Трымайце Przepraszam
      і польскія пытанні пра лінію, выход і час асобна ад L1.
grammar_points:
  - id: GP-A1-DT-L2
    title_pl: Linia, przystanek i godzina
    summary_ru: >
      Три коротких куска у остановки: линия до цели, остановка выхода
      и время отправления.
    form: >
      Który autobus jedzie do + Gen? Na którym przystanku mam wysiąść?
      O której odjeżdża…?
    meaning: >
      Собрать маршрут: куда едет автобус, где выйти и во сколько отъезд.
    use: >
      На остановке или в салоне — уточнить у взрослого пассажира, без
      сложной пересадки.
    examples_pl: *a1
    counterexamples_pl:
      - "*Ty daj." # грубо / неполный ответ
      - "*Ja nie rozumieć." # ломаная рамка
    concept_ids:
      - GR-MOT-BASE-01
      - GR-PREP-DO-NA-01
      - GR-NUM-MONEY-01
    l1_notes:
      ukr: >
        ERR-тип: *який автобус на центр vs który autobus jedzie do centrum;
        вихід — na którym przystanku, не калька «на якій».
      rus: >
        «Какой автобус на центр» часто ломает рамку. Учите który… do + Gen
        и O której odjeżdża… целиком.
      bel: >
        Не пераносьце «які аўтобус на цэнтр» у польскую рамку. Раздзяляйце
        który / na którym / o której па дыялогу.
l1_notes:
  ukr: >
    Урок про лінію, вихід і час: Który autobus…, Na którym przystanku…,
    O której…? Починайте з Przepraszam; не калькуйте «скажи мені».
  rus: >
    Фокус: линия → остановка выхода → время отправления, без ty к
    незнакомцу. Слушайте номер и ориентир вместе; время — формулой O której…?
  bel: >
    Асобны акцэнт BEL: не капіюйце рускія нотаткі. Лінія, выход і час —
    польскія рамкі; лічэбнікі прыпынкаў без акання.
