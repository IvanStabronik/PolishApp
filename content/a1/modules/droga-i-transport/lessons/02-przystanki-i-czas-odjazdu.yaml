dialogue:
  title_pl: Przystanki i czas odjazdu
  turns:
    - speaker: Mila
      text_pl: Przepraszam, który autobus jedzie do centrum?
    - speaker: Pasażer
      text_pl: Autobus numer osiem.
    - speaker: Mila
      text_pl: Na którym przystanku mam wysiąść?
    - speaker: Pasażer
      text_pl: Na czwartym, przy poczcie.
    - speaker: Mila
      text_pl: Dziękuję. O której odjeżdża autobus?
    - speaker: Pasażer
      text_pl: O dziewiątej dziesięć.
    - speaker: Mila
      text_pl: Rozumiem. Bardzo dziękuję.
key_lines:
  - text_pl: Który autobus jedzie do centrum?
    explanation_ru: Вопрос о подходящей линии.
  - text_pl: Na którym przystanku mam wysiąść?
    explanation_ru: Вопрос о нужной остановке выхода.
  - text_pl: Na czwartym, przy poczcie.
    explanation_ru: Номер остановки плюс ориентир.
  - text_pl: O której odjeżdża autobus?
    explanation_ru: Уточнение точного времени.
pan_pani:
  summary_ru: С незнакомым взрослым собеседником сохраняйте pan/pani и третье лицо; нейтральные
    просьбы и благодарность важнее буквального переноса форм L1.
  form: która linia · na którym przystanku · o której
  examples_pl: &a1
    - Który autobus jedzie do centrum?
    - Na którym przystanku mam wysiąść?
    - O której odjeżdża autobus?
  counterexamples_pl:
    - "*Ty mi powiedz."
    - "*Daj mi to."
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: Відпрацьовуйте польську рамку «która linia · na którym przystanku · o której» цілісно; не
      складайте її дослівно з українських слів.
    rus: Отрабатывайте польскую рамку «która linia · na którym przystanku · o której» целиком, без
      дословной кальки с русского.
    bel: Адпрацоўвайце польскую рамку «która linia · na którym przystanku · o której» цалкам; не
      складайце яе даслоўна з беларускай.
