kind: lesson
canonical_id: LES-A1-DT-02
slug: przystanki-i-czas-odjazdu
version: 6
status: DRAFT
title_pl: Przystanki i czas odjazdu
sort_order: 2
situation_ru: >
  Вы на остановке в Польше. Нужно уточнить у взрослого пассажира:
  какой автобус идёт куда, на какой остановке выйти и во сколько отъезд.
  Речь спокойная, на pan/pani.
objective_ru: >
  Спросить линию (który autobus…), остановку выхода (na którym przystanku…)
  и время отправления (o której…) — три коротких шага до простой поездки.
curriculum_links:
  scenarios:
    - SCN-A1-DIRECTIONS-01
    - SCN-A1-TICKET-01
  functions:
    - FN-A1-DIRECT-01
    - FN-A1-TRANS-01
    - FN-A1-ASK-01
    - FN-A1-TIME-01
    - FN-A1-THANKS-01
  lex_bundles:
    - LEX-A1-TRANSPORT
    - LEX-A1-MONEY
  concepts:
    - GR-MOT-BASE-01
    - GR-PREP-DO-NA-01
    - GR-NUM-MONEY-01
    - GR-TIME-EXPR-01
    - PRAG-PAN-01
dialogue:
  title_pl: Przystanki i czas odjazdu
  turns:
    - speaker: Mila
      text_pl: Przepraszam, który autobus jedzie do centrum?
    - speaker: Pasażer
      text_pl: Autobus numer osiem.
    - speaker: Mila
      text_pl: Na którym przystanku mam wysiąść?
    - speaker: Pasażer
      text_pl: Na czwartym, przy poczcie.
    - speaker: Mila
      text_pl: Dziękuję. O której odjeżdża autobus?
    - speaker: Pasażer
      text_pl: O dziewiątej dziesięć.
    - speaker: Mila
      text_pl: Rozumiem. Bardzo dziękuję.
key_lines:
  - text_pl: Który autobus jedzie do centrum?
    explanation_ru: >
      Вопрос о линии до цели. Który autobus + jedzie do + Gen —
      обычный старт у остановки.
  - text_pl: Na którym przystanku mam wysiąść?
    explanation_ru: >
      Спрашиваете, где выйти. Слушайте и номер остановки, и ориентир
      рядом (przy poczcie).
  - text_pl: Na czwartym, przy poczcie.
    explanation_ru: >
      Короткий ответ: порядковый номер + место. Держите оба куска —
      так проще не проехать мимо.
  - text_pl: O której odjeżdża autobus?
    explanation_ru: >
      Вопрос о точном времени отправления. В ответе часто O + час
      (O dziewiątej dziesięć).
pan_pani:
  summary_ru: >
    К незнакомому пассажиру — Przepraszam, pan/pani и спокойный тон.
    Три вопроса (линия, выход, время) + Dziękuję. Форма ty и резкое
    *Ej… / *Ty mi powiedz — не к незнакомцу на остановке.
  form: "Który autobus…? · Na którym przystanku…? · O której odjeżdża…?"
  examples_pl: &a1
    - Który autobus jedzie do centrum?
    - Na którym przystanku mam wysiąść?
    - O której odjeżdża autobus?
  counterexamples_pl:
    - "*Ty mi powiedz." # слишком свои
    - "*Jaki autobus na centrum?" # L1-калька предлога
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      «Який автобус / на якій / о котрій» → który… / na którym… / o której…
      цілком. do centrum ≠ *на centrum; старт — Przepraszam.
    rus: >
      Не говорите ty пассажиру. Учите три вопроса целиком: który autobus…
      / na którym przystanku… / o której… — без «на центр».
    bel: >
      «Скажы мне» не робіць *Ty mi powiedz. który / na którym / o której —
      асобныя польскія рамкі; do centrum без акання.
grammar_points:
  - id: GP-A1-DT-L2
    title_pl: Linia, przystanek i godzina
    summary_ru: >
      Три коротких куска у остановки: линия до цели, остановка выхода
      и время отправления.
    form: >
      Który autobus jedzie do + Gen? Na którym przystanku mam wysiąść?
      O której odjeżdża…?
    meaning: >
      Собрать маршрут: куда едет автобус, где выйти и во сколько отъезд.
    use: >
      На остановке или в салоне — уточнить у взрослого пассажира, без
      сложной пересадки.
    examples_pl: *a1
    counterexamples_pl:
      - "*Jaki autobus na centrum?" # L1-предлог
      - "*Na dziewięć." # сломанный ответ о времени
    concept_ids:
      - GR-MOT-BASE-01
      - GR-PREP-DO-NA-01
      - GR-TIME-EXPR-01
    l1_notes:
      ukr: >
        *який автобус на центр → który autobus jedzie do centrum; вихід —
        na którym przystanku (Gen), не «на якій» + номінатив.
      rus: >
        «Какой автобус на центр» ломает рамку. Учите który… do + Gen
        и O której odjeżdża… целиком.
      bel: >
        «Які аўтобус на цэнтр» → który… do + Gen. który / na którym / o której —
        тры асобныя формулы.
l1_notes:
  ukr: >
    Не калькуйте «скажи мені / який на центр». Тримайте który… do…,
    na którym przystanku…, O której…?; старт — Przepraszam.
  rus: >
    Фокус: линия → остановка выхода → время отправления, без ty к
    незнакомцу. Слушайте номер и ориентир вместе; время — формулой O której…?
  bel: >
    Не спадзявайцеся на «і так зразумеюць». który… / na którym… / o której… —
    асобныя польскія рамкі; лічэбнікі прыпынкаў без акання.
