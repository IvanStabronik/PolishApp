kind: lesson
canonical_id: LES-A1-DT-02
slug: przystanki-i-czas-odjazdu
version: 2
status: DRAFT
title_pl: Przystanki i czas odjazdu
sort_order: 2
situation_ru: >
  Вы на остановке в Польше. Нужно уточнить у взрослого пассажира:
  какой автобус идёт куда, на какой остановке выйти и во сколько отъезд.
  Речь спокойная, на pan/pani.
objective_ru: >
  Спросить линию (który autobus…), остановку выхода (na którym przystanku…)
  и время отправления (o której…) — три коротких шага до простой поездки.
