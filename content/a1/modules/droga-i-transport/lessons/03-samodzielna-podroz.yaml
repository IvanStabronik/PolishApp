dialogue:
  title_pl: Samodzielna podróż
  turns:
    - speaker: Roman
      text_pl: Przepraszam, gdzie jest przystanek tramwajowy?
    - speaker: Przechodnia
      text_pl: Prosto i potem w lewo, obok banku.
    - speaker: Roman
      text_pl: Dziękuję. Czy tramwaj numer trzy jedzie do centrum?
    - speaker: Przechodnia
      text_pl: Tak, jedzie.
    - speaker: Roman
      text_pl: Dzień dobry. Poproszę bilet na tramwaj.
    - speaker: Sprzedawca
      text_pl: Cztery złote.
    - speaker: Roman
      text_pl: Kartą, proszę. Na którym przystanku mam wysiąść?
    - speaker: Sprzedawca
      text_pl: Na piątym.
key_lines:
  - text_pl: Gdzie jest przystanek tramwajowy?
    explanation_ru: Самостоятельный старт навигации.
  - text_pl: Czy tramwaj numer trzy jedzie do centrum?
    explanation_ru: Проверка выбранной линии.
  - text_pl: Poproszę bilet na tramwaj.
    explanation_ru: Покупка подходящего билета.
  - text_pl: Na którym przystanku mam wysiąść?
    explanation_ru: Контроль конечного шага поездки.
pan_pani:
  summary_ru: С незнакомым взрослым собеседником сохраняйте pan/pani и третье лицо; нейтральные
    просьбы и благодарность важнее буквального переноса форм L1.
  form: gdzie · do centrum · bilet na autobus · wysiąść
  examples_pl: &a1
    - Gdzie jest przystanek?
    - Czy tramwaj jedzie do centrum?
    - Poproszę bilet na tramwaj.
  counterexamples_pl:
    - "*Ty mi powiedz."
    - "*Daj mi to."
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: Відпрацьовуйте польську рамку «gdzie · do centrum · bilet na autobus · wysiąść» цілісно; не
      складайте її дослівно з українських слів.
    rus: Отрабатывайте польскую рамку «gdzie · do centrum · bilet na autobus · wysiąść» целиком, без
      дословной кальки с русского.
    bel: Адпрацоўвайце польскую рамку «gdzie · do centrum · bilet na autobus · wysiąść» цалкам; не
      складайце яе даслоўна з беларускай.
