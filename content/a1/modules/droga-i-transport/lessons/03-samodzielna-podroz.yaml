kind: lesson
canonical_id: LES-A1-DT-03
slug: samodzielna-podroz
version: 6
status: DRAFT
title_pl: Samodzielna podróż
sort_order: 3
situation_ru: >
  Вы в городе в Польше: сами находите остановку трамвая, проверяете линию,
  покупаете билет и уточняете, где выйти. Прохожий и продавец — взрослые
  незнакомцы. Одна простая поездка, без пересадок; речь спокойная.
objective_ru: >
  Собрать маршрут целиком: где przystanek, едет ли tramwaj do цели,
  Poproszę bilet na… и na którym przystanku wysiąść — на pan/pani.
curriculum_links:
  scenarios:
    - SCN-A1-DIRECTIONS-01
    - SCN-A1-TICKET-01
  functions:
    - FN-A1-DIRECT-01
    - FN-A1-TRANS-01
