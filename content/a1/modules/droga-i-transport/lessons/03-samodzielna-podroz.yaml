    - LEX-A1-MONEY
  concepts:
    - GR-MOT-BASE-01
    - GR-PREP-DO-NA-01
    - GR-NUM-MONEY-01
    - GR-TIME-EXPR-01
    - PRAG-PAN-01
dialogue:
  title_pl: Samodzielna podróż
  turns:
    - speaker: Roman
      text_pl: Przepraszam, gdzie jest przystanek tramwajowy?
    - speaker: Przechodnia
      text_pl: Prosto i potem w lewo, obok banku.
    - speaker: Roman
      text_pl: Dziękuję. Czy tramwaj numer trzy jedzie do centrum?
    - speaker: Przechodnia
      text_pl: Tak, jedzie.
    - speaker: Roman
      text_pl: Dzień dobry. Poproszę bilet na tramwaj.
    - speaker: Sprzedawca
      text_pl: Cztery złote.
    - speaker: Roman
      text_pl: Kartą, proszę. Na którym przystanku mam wysiąść?
    - speaker: Sprzedawca
      text_pl: Na piątym.
key_lines:
  - text_pl: Gdzie jest przystanek tramwajowy?
    explanation_ru: >
      Обычный вопрос про остановку трамвая. К незнакомцу на улице начинайте
      с Przepraszam — так контакт спокойный.
  - text_pl: Czy tramwaj numer trzy jedzie do centrum?
    explanation_ru: >
      Проверка линии до цели: Czy + транспорт + jedzie do + Gen.
      Слушайте короткий ответ Tak / Nie.
  - text_pl: Poproszę bilet na tramwaj.
    explanation_ru: >
      Заказ билета: Poproszę bilet + na + Acc. Не *Daj bilet к продавцу-незнакомцу.
  - text_pl: Na którym przystanku mam wysiąść?
    explanation_ru: >
      Спрашиваете, где выйти. В ответе часто порядковый номер
      (Na piątym) — держите его.
pan_pani:
  summary_ru: >
    И к прохожему, и к продавцу билетов — pan/pani и спокойный тон:
    Przepraszam…, Poproszę bilet…, Dziękuję. Форма ty и резкое *Ej…
    / *Ty mi powiedz — не к незнакомцу на улице или у кассы.
  form: "Gdzie jest…? · Czy … jedzie do…? · Poproszę bilet na… · Na którym przystanku…?"
  examples_pl: &a1
    - Gdzie jest przystanek?
    - Czy tramwaj jedzie do centrum?
    - Poproszę bilet na tramwaj.
  counterexamples_pl:
    - "*Ty mi powiedz." # слишком свои
    - "*Bilet do tramwaj." # путаница do/na
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      «Де / на центр / дай квиток» → gdzie… / jedzie do… / Poproszę bilet na….
      Ланцюжок польськими формулами; старт — Przepraszam.
    rus: >
      Не говорите ty прохожему или продавцу. Учите четыре шага целиком:
      gdzie… / czy … do… / bilet na… / na którym… — без кальки «скажи мне».
    bel: >
      «Скажы мне» не робіць *Ty mi powiedz. Прыпынак → лінія → квіток → выход —
      асобныя польскія рамкі; без ty і без акання ў нумарах.
grammar_points:
  - id: GP-A1-DT-L3
    title_pl: Od drogi do przejazdu
    summary_ru: >
      Четыре коротких куска одной поездки: остановка, проверка линии,
      билет и выход — без пересадок.
    form: >
      Gdzie jest…? Czy X jedzie do + Gen? Poproszę bilet na + Acc.
      Na którym przystanku mam wysiąść?
    meaning: >
      Собрать простую поездку: найти остановку, подтвердить линию,
      купить билет и узнать, где выйти.
    use: >
      На улице и у продавца — один маршрут без сложной пересадки.
    examples_pl: *a1
    counterexamples_pl:
      - "*Bilet do tramwaj." # путаница do/na
      - "*Jedzie na centrum." # L1-предлог
    concept_ids:
      - GR-MOT-BASE-01
      - GR-PREP-DO-NA-01
      - GR-CAS-ACC-01
    l1_notes:
      ukr: >
        *їхати на центр → jedzie do centrum; квиток — bilet na tramwaj,
        не *bilet do tramwaj.
      rus: >
        «На центр» и «билет на трамвай» путают предлоги. Учите jedzie do + Gen
        и bilet na + Acc целиком.
      bel: >
        «На цэнтр / квіток да трамвая» → do centrum / bilet na tramwaj.
        do і na — розныя рамкі.
l1_notes:
  ukr: >
    Не калькуйте «на центр / дай квиток». Тримайте gdzie…, jedzie do…,
    bilet na…, Na którym…?; старт — Przepraszam.
  rus: >
    Фокус: остановка → линия → билет → выход, без ty к незнакомцу.
    Держите do для цели и na для билета; выход — формулой Na którym…?
  bel: >
    Не спадзявайцеся на «і так зразумеюць». gdzie… / do… / bilet na… /
    Na którym…? — асобныя польскія рамкі; лічэбнікі без акання.
