kind: lesson
canonical_id: LES-A1-DT-01
slug: bilet-i-droga
version: 3
status: DRAFT
title_pl: Bilet i droga
sort_order: 1
situation_ru: >
  Вы в городе в Польше: ищете остановку автобуса и покупаете простой билет.
  Прохожий и кассир — взрослые незнакомцы. Маршрут короткий (2–3 шага),
  без пересадок; речь спокойная.
objective_ru: >
  Спросить дорогу до przystanku, понять prosto / w lewo / w prawo,
  заказать bilet и уточнить отправление — на pan/pani, не на ty.
