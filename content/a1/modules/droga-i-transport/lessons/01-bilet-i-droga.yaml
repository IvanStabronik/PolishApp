    - FN-A1-TIME-01
    - FN-A1-THANKS-01
  lex_bundles:
    - LEX-A1-TRANSPORT
    - LEX-A1-MONEY
  concepts:
    - GR-MOT-BASE-01
    - GR-PREP-DO-NA-01
    - GR-NUM-MONEY-01
    - GR-TIME-EXPR-01
    - PRAG-PAN-01
dialogue:
  title_pl: Do przystanku i po bilet
  turns:
    - speaker: Hanna
      text_pl: Przepraszam, gdzie jest przystanek autobusowy?
    - speaker: Przechodzień
      text_pl: Prosto, potem w prawo. Przystanek jest koło sklepu.
    - speaker: Hanna
      text_pl: Dziękuję. Jak dojść do dworca?
    - speaker: Przechodzień
      text_pl: Autobusem linii 12. Wysiada pani na trzecim przystanku.
    - speaker: Hanna
      text_pl: Rozumiem. Dziękuję!
    - speaker: Kasjer
      text_pl: Dzień dobry.
    - speaker: Hanna
      text_pl: Dzień dobry. Poproszę bilet na autobus. O której odjeżdża dwunastka?
    - speaker: Kasjer
      text_pl: Za dziesięć minut. Bilet normalny — cztery złote.
    - speaker: Hanna
      text_pl: Proszę. Płacę gotówką. Dziękuję.
    - speaker: Kasjer
      text_pl: Proszę bardzo. Do widzenia.
key_lines:
  - text_pl: Gdzie jest przystanek autobusowy?
    explanation_ru: >
      Обычный вопрос про остановку. К незнакомцу на улице начинайте
      с Przepraszam — так контакт спокойный и вежливый.
  - text_pl: Prosto, potem w prawo.
    explanation_ru: >
      Короткие ориентиры пути: prosto / w lewo / w prawo. Слушайте их
      как шаги маршрута, а не как отдельные слова.
  - text_pl: Poproszę bilet na autobus.
    explanation_ru: >
      Заказ билета: Poproszę bilet + na + Acc (вид транспорта). Не *Daj bilet
      к кассиру-незнакомцу.
  - text_pl: O której odjeżdża…?
    explanation_ru: >
      Вопрос о времени отправления. В ответе часто «za X minut»
      или точный час — слушайте целиком.
pan_pani:
  summary_ru: >
    И к прохожему, и к кассиру билетов — pan/pani и спокойный тон:
    Przepraszam…, Poproszę bilet…, Dziękuję. Форма ty и резкое *Ej…
    — не к незнакомцу на улице или у кассы.
  form: "Przepraszam, gdzie jest…? · Jak dojść / dojechać do…? · Poproszę bilet…"
  examples_pl:
    - Przepraszam, gdzie jest przystanek?
    - Jak dojechać do dworca?
    - Poproszę bilet na autobus.
  counterexamples_pl:
    - "*Ej, gdzie przystanek?" # грубо
    - "*Idę на dworzec." # неверный предлог
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      «Ей» → не замість Przepraszam. do dworca ≠ *на dworzec; bilet na autobus —
      окрема рамка від напрямку.
    rus: >
      «На вокзал» часто даёт *na dworzec вместо do dworca. Не говорите
      ty прохожему; держите Przepraszam + вопрос.
    bel: >
      «На вакзал / на прыпынак» не робіць *na dworzec. Przepraszam… + do + Gen;
      без ty да незнаёмца.
grammar_points:
  - id: GP-A1-DT-DO-NA-BILET
    title_pl: do / na · bilet · odjazd
    summary_ru: >
      Два коротких куска в городе: направление (do + Gen) и билет
      (bilet na + Acc), плюс вопрос об отправлении.
    form: >
      Jak dojść / dojechać do + Gen. Bilet na + Acc. O której odjeżdża…?
      Orientacja: prosto / w lewo / w prawo.
    meaning: >
      Получить маршрут до цели и купить простой билет с временем отправления.
    use: >
      Пешком до остановки, затем касса или киоск одного вида транспорта —
      без пересадок.
    examples_pl:
      - Jak dojechać do dworca?
      - Poproszę bilet na autobus.
      - O której odjeżdża dwunastka?
    counterexamples_pl:
      - "*Idę w przystanek." # неверная рамка
      - "*Bilet do autobus." # путаница do/na
      - "*Na której odjeżdża?" # смешение вопросительных
    concept_ids:
      - GR-PREP-DO-NA-01
      - GR-MOT-BASE-01
      - GR-TIME-EXPR-01
    l1_notes:
      ukr: >
        *їхати на автобусі → autobusem; do dworca ≠ *на dworzec.
      rus: >
        «На автобусе» и «до вокзала» путают предлоги. Учите dojechać do + Gen
        и bilet na + Acc целиком.
      bel: >
        «На прыпынак» ≠ адзіная мадэль. do + Gen для мэты; bilet na + Acc —
        асобна.
l1_notes:
  ukr: >
    Не калькуйте «на вокзал / на автобусі». Тримайте do + Gen, bilet na…,
    O której…?; до незнайомця — Przepraszam, не «ей».
  rus: >
    Фокус: do vs na в городе и в билете, без ty к незнакомцу. Слушайте
    ориентиры как шаги; время отправления — формулой O której…?
  bel: >
    Не спадзявайцеся на «і так зразумеюць». do… / bilet na… / O której…? —
    асобныя польскія рамкі; пісьмо ліній без акання.
