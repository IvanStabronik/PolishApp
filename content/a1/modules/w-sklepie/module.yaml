situation_ru: >
  Покупка нескольких простых товаров у кассы в небольшом польском магазине.
  Витрина ограничена; кассир — взрослый незнакомец; нужна ясная транзакция
  с количеством, ценой и способом оплаты.
objective_ru: >
  После модуля учащийся может назвать товар и количество, спросить цену,
  подтвердить оплату (gotówka / karta) и вежливо закрыть контакт в регистре
  pan/pani, не скатываясь в ty к кассиру.
