status: DRAFT
title_pl: Ilość, cena i paragon
sort_order: 2
situation_ru: Вы уточняете количество нескольких товаров, проверяете сумму и просите чек.
objective_ru: Связать количество, цену и чек в последовательную покупку у кассы.
curriculum_links:
  scenarios:
    - SCN-A1-SHOP-01
  functions:
    - FN-A1-TRANS-01
    - FN-A1-QUANT-01
    - FN-A1-ASK-01
