  concepts:
    - GR-CAS-ACC-01
    - GR-NUM-MONEY-01
    - GR-NUM-CARD-01
    - PRAG-PAN-01
dialogue:
  title_pl: Ilość, cena i paragon
  turns:
    - speaker: Kasjerka
      text_pl: Dzień dobry. Co dla pana?
    - speaker: Artem
      text_pl: Poproszę dwa jabłka i jedną wodę.
    - speaker: Kasjerka
      text_pl: Małą czy dużą wodę?
    - speaker: Artem
      text_pl: Małą, proszę. Ile kosztują jabłka?
    - speaker: Kasjerka
      text_pl: Sześć złotych.
    - speaker: Artem
      text_pl: Dobrze. Poproszę też torbę.
    - speaker: Kasjerka
      text_pl: Razem jedenaście złotych.
    - speaker: Artem
      text_pl: Płacę gotówką. Poproszę paragon.
key_lines:
  - text_pl: Poproszę dwa jabłka i jedną wodę.
    explanation_ru: Количество включено в одну реплику выбора.
  - text_pl: Ile kosztują jabłka?
    explanation_ru: Вопрос о цене нескольких предметов.
  - text_pl: Razem jedenaście złotych.
    explanation_ru: Кассир сообщает итоговую сумму.
  - text_pl: Poproszę paragon.
    explanation_ru: Вежливая просьба о чеке.
pan_pani:
  summary_ru: С незнакомым взрослым собеседником сохраняйте pan/pani и третье лицо; нейтральные
    просьбы и благодарность важнее буквального переноса форм L1.
  form: jedno/dwa · ile kosztuje · paragon
  examples_pl: &a1
    - Poproszę dwa jabłka.
    - Ile kosztują jabłka?
    - Poproszę paragon.
  counterexamples_pl:
    - "*Ty mi powiedz."
    - "*Daj mi to."
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: Відпрацьовуйте польську рамку «jedno/dwa · ile kosztuje · paragon» цілісно; не складайте її
      дослівно з українських слів.
    rus: Отрабатывайте польскую рамку «jedno/dwa · ile kosztuje · paragon» целиком, без дословной кальки
      с русского.
    bel: Адпрацоўвайце польскую рамку «jedno/dwa · ile kosztuje · paragon» цалкам; не складайце яе
      даслоўна з беларускай.
