    meaning: Связать знакомые A1-реплики в понятное действие внутри ситуации.
    use: Вы уточняете количество нескольких товаров, проверяете сумму и просите чек.
    examples_pl: *a1
    counterexamples_pl:
      - "*Ty daj."
      - "*Ja nie rozumieć."
    concept_ids:
      - GR-CAS-ACC-01
      - GR-NUM-MONEY-01
      - GR-NUM-CARD-01
    l1_notes:
