kind: lesson
canonical_id: LES-A1-WS-02
slug: ilosc-cena-i-paragon
version: 6
status: DRAFT
title_pl: Ilość, cena i paragon
sort_order: 2
situation_ru: >
  Вы у кассы: несколько товаров с разным количеством. Нужно назвать
  количество, уточнить цену или итог и попросить чек. Кассир — взрослый
  незнакомец; речь спокойная.
objective_ru: >
  Связать количество, цену (или Razem…) и paragon в одну покупку —
  на pan/pani, без ty к кассиру.
curriculum_links:
  scenarios:
    - SCN-A1-SHOP-01
  functions:
    - FN-A1-TRANS-01
    - FN-A1-QUANT-01
    - FN-A1-ASK-01
    - FN-A1-ADDRESS-01
    - FN-A1-CONFIRM-01
    - FN-A1-THANKS-01
  lex_bundles:
    - LEX-A1-SERVICE
    - LEX-A1-MONEY
  concepts:
    - GR-CAS-ACC-01
    - GR-NUM-MONEY-01
    - GR-NUM-CARD-01
    - PRAG-PAN-01
dialogue:
  title_pl: Ilość, cena i paragon
  turns:
    - speaker: Kasjerka
      text_pl: Dzień dobry. Co dla pana?
    - speaker: Artem
      text_pl: Poproszę dwa jabłka i jedną wodę.
    - speaker: Kasjerka
      text_pl: Małą czy dużą wodę?
    - speaker: Artem
      text_pl: Małą, proszę. Ile kosztują jabłka?
    - speaker: Kasjerka
      text_pl: Sześć złotych.
    - speaker: Artem
      text_pl: Dobrze. Poproszę też torbę.
    - speaker: Kasjerka
      text_pl: Razem jedenaście złotych.
    - speaker: Artem
      text_pl: Płacę gotówką. Poproszę paragon.
key_lines:
  - text_pl: Poproszę dwa jabłka i jedną wodę.
    explanation_ru: >
      Выбор и количество в одной реплике: Poproszę + число + товар
      (Acc). Dwa jabłka / jedną wodę — готовые слоты, не сборка
      по словам из L1.
  - text_pl: Ile kosztują jabłka?
    explanation_ru: >
      Вопрос о цене нескольких предметов: kosztują (мн. ч.).
      Для одного товара чаще Ile to kosztuje? / Ile kosztuje…?
  - text_pl: Razem jedenaście złotych.
    explanation_ru: >
      Кассир называет итог. Слушайте сумму целиком: złotych как
      один числовой кусок.
  - text_pl: Poproszę paragon.
    explanation_ru: >
      Спокойная просьба о чеке — без *Daj… и без ty к кассиру.
pan_pani:
  summary_ru: >
    К кассиру-незнакомцу — pan/pani и спокойный сервисный тон:
    Poproszę…, Ile kosztują…?, Poproszę paragon. Форма ty и резкое
    *Daj… — не к незнакомцу у кассы.
  form: "Poproszę dwa… · Ile kosztują…? · Poproszę paragon."
  examples_pl: &a1
    - Poproszę dwa jabłka.
    - Ile kosztują jabłka?
    - Poproszę paragon.
  counterexamples_pl:
    - "*Ty mi powiedz." # ty к кассиру
    - "*Daj mi to." # резко
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      «Два яблука» → dwa jabłka (не *dwie jabłka). «Скільки коштують» →
      Ile kosztują…?; «дайте чек» → Poproszę paragon, не *Daj.
    rus: >
      Не *dwie jabłka и не «сколько стоят» порядком L1. kosztują для мн. ч.;
      чек — Poproszę paragon, не приказ.
    bel: >
      Не *dwie jabłka (род ліку). Ile kosztują…? і Poproszę paragon —
      цэлыя; аканне ў Razem… на пісьме не пераносіце.
grammar_points:
  - id: GP-A1-WS-L2
    title_pl: Ilość i suma
    summary_ru: >
      Три коротких куска у кассы: количество, цена/итог и чек.
    form: >
      Poproszę + liczba + produkt. Ile kosztuje / kosztują…?
      Razem X złotych. Poproszę paragon.
    meaning: >
      Согласовать количество и сумму, затем закрыть покупку чеком.
    use: >
      Несколько товаров у кассы; уточнение размера; итог и оплата.
    examples_pl: *a1
    counterexamples_pl:
      - "*Ty daj." # грубо + ty
      - "*Ja nie rozumieć." # сломанный глагол
    concept_ids:
      - GR-CAS-ACC-01
      - GR-NUM-MONEY-01
      - GR-NUM-CARD-01
    l1_notes:
      ukr: >
        Після Poproszę — Acc (dwa jabłka, jedną wodę), не *dwie jabłka.
        Для кількох — kosztują; Razem… слухайте як підсумок, не ціну однієї позиції.
      rus: >
        Не *dwie jabłka. kosztują для мн. ч.; Razem… — итог, не цена только jabłek.
        Poproszę paragon — не *Daj paragon.
      bel: >
        Acc: dwa jabłka. Ile kosztują…? ≠ адзіночны kosztuje.
        Razem… — вынік; аканне ў сумах не пераносіце.
l1_notes:
  ukr: >
    Пастки: *dwie jabłka, *kosztuje для мн., *Daj paragon.
    Тримайте dwa… / Ile kosztują…? / Razem… / Poproszę paragon.
  rus: >
    Пастки: род числа, единственное kosztuje для мн., приказ вместо Poproszę.
    Связка: количество → цена/итог → чек.
  bel: >
    Пасткі: *dwie jabłka, аканне ў Razem…, *Daj замест Poproszę paragon.
    Вучыце рамкі цэлымі.
