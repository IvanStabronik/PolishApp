kind: lesson
canonical_id: LES-A1-WS-02
slug: ilosc-cena-i-paragon
version: 5
status: DRAFT
title_pl: Ilość, cena i paragon
sort_order: 2
situation_ru: >
  Вы у кассы: несколько товаров с разным количеством. Нужно назвать
  количество, уточнить цену или итог и попросить чек. Кассир — взрослый
  незнакомец; речь спокойная.
objective_ru: >
  Связать количество, цену (или Razem…) и paragon в одну покупку —
  на pan/pani, без ty к кассиру.
curriculum_links:
  scenarios:
    - SCN-A1-SHOP-01
  functions:
    - FN-A1-TRANS-01
    - FN-A1-QUANT-01
    - FN-A1-ASK-01
    - FN-A1-ADDRESS-01
    - FN-A1-CONFIRM-01
    - FN-A1-THANKS-01
  lex_bundles:
    - LEX-A1-SERVICE
    - LEX-A1-MONEY
  concepts:
    - GR-CAS-ACC-01
    - GR-NUM-MONEY-01
    - GR-NUM-CARD-01
    - PRAG-PAN-01
dialogue:
  title_pl: Ilość, cena i paragon
  turns:
    - speaker: Kasjerka
      text_pl: Dzień dobry. Co dla pana?
    - speaker: Artem
      text_pl: Poproszę dwa jabłka i jedną wodę.
    - speaker: Kasjerka
      text_pl: Małą czy dużą wodę?
    - speaker: Artem
      text_pl: Małą, proszę. Ile kosztują jabłka?
    - speaker: Kasjerka
      text_pl: Sześć złotych.
    - speaker: Artem
      text_pl: Dobrze. Poproszę też torbę.
    - speaker: Kasjerka
      text_pl: Razem jedenaście złotych.
    - speaker: Artem
      text_pl: Płacę gotówką. Poproszę paragon.
key_lines:
  - text_pl: Poproszę dwa jabłka i jedną wodę.
    explanation_ru: >
      Выбор и количество в одной реплике: Poproszę + число + товар
      (Acc). Dwa jabłka / jedną wodę — готовые слоты, не сборка
      по словам из L1.
  - text_pl: Ile kosztują jabłka?
    explanation_ru: >
      Вопрос о цене нескольких предметов: kosztują (мн. ч.).
      Для одного товара чаще Ile to kosztuje? / Ile kosztuje…?
  - text_pl: Razem jedenaście złotych.
    explanation_ru: >
      Кассир называет итог. Слушайте сумму целиком: złotych как
      один числовой кусок.
  - text_pl: Poproszę paragon.
    explanation_ru: >
      Спокойная просьба о чеке — без *Daj… и без ty к кассиру.
pan_pani:
  summary_ru: >
    К кассиру-незнакомцу — pan/pani и спокойный сервисный тон:
    Poproszę…, Ile kosztują…?, Poproszę paragon. Форма ty и резкое
    *Daj… — не к незнакомцу у кассы.
  form: "Poproszę dwa… · Ile kosztują…? · Poproszę paragon."
  examples_pl: &a1
    - Poproszę dwa jabłka.
    - Ile kosztują jabłka?
    - Poproszę paragon.
  counterexamples_pl:
    - "*Ty mi powiedz." # ty к кассиру
    - "*Daj mi to." # резко
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      «Дайте» не збирає покупку. Тримайте dwa/jedną + Acc,
      Ile kosztują…? і Poproszę paragon; «ти» до касира — лише якщо сам
      запропонував.
    rus: >
      Не собирайте «два яблока / сколько стоит / чек» дословной калькой.
      Poproszę… и Ile kosztują…? — польские рамки; без ty к кассиру.
    bel: >
      Не з «дайце / колькі». Poproszę…, Ile kosztują…? і Poproszę paragon —
      вучыце цэлымі; да касіра не ty, пакуль ён сам не прапануе.
grammar_points:
  - id: GP-A1-WS-L2
    title_pl: Ilość i suma
    summary_ru: >
      Три коротких куска у кассы: количество, цена/итог и чек.
    form: >
      Poproszę + liczba + produkt. Ile kosztuje / kosztują…?
      Razem X złotych. Poproszę paragon.
    meaning: >
      Согласовать количество и сумму, затем закрыть покупку чеком.
    use: >
      Несколько товаров у кассы; уточнение размера; итог и оплата.
    examples_pl: *a1
    counterexamples_pl:
      - "*Ty daj." # грубо + ty
      - "*Ja nie rozumieć." # сломанный глагол
    concept_ids:
      - GR-CAS-ACC-01
      - GR-NUM-MONEY-01
      - GR-NUM-CARD-01
    l1_notes:
      ukr: >
        Після Poproszę — Acc (dwa jabłka, jedną wodę), не називний.
        Для кількох — kosztują, не *Skilky kosztuje.
      rus: >
        Не калькируйте «сколько стоят яблоки» порядком слов.
        Dwa jabłka — готовый слот; kosztują для мн. ч.
      bel: >
        Acc пасля Poproszę (dwa jabłka). Ile kosztują…? і Razem… —
        цэлыя; аканне ў сумах на пісьме не пераносіце.
l1_notes:
  ukr: >
    Кількість (dwa/jedną), Ile kosztują…?, Razem… і Poproszę paragon.
    Без кальки «дайте»; pan/pani до касира.
  rus: >
    Количество, цена/итог и чек без L1-сборки и без ty у кассы.
    Запомните Poproszę dwa…, Ile kosztują…? и Poproszę paragon целиком.
  bel: >
    Dwa… / Ile kosztują…? / Razem… / Poproszę paragon — асобныя рамкі.
    Не спадзявайцеся на кальку «дайце»; да касіра — не ty.
