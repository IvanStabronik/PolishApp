        złotych.» цілісно; не складайте її дослівно з українських слів.
      rus: Отрабатывайте польскую рамку «Poproszę + liczba + produkt. Ile kosztuje/kosztują…? Razem X
        złotych.» целиком, без дословной кальки с русского.
      bel: Адпрацоўвайце польскую рамку «Poproszę + liczba + produkt. Ile kosztuje/kosztują…? Razem X
        złotych.» цалкам; не складайце яе даслоўна з беларускай.
