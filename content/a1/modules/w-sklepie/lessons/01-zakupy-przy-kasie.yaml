slug: zakupy-przy-kasie
version: 1
status: DRAFT
title_pl: Zakupy przy kasie
sort_order: 1
situation_ru: >
  Вы покупаете хлеб и молоко у кассы в небольшом магазине. Кассир —
  взрослый незнакомец; нужно назвать товары, количество, спросить цену
  и выбрать способ оплаты.
objective_ru: >
  Назвать товар и количество, спросить ile to kosztuje, подтвердить оплату
  и поблагодарить — удерживая pan/pani к кассиру.
