dialogue:
  title_pl: Przy kasie w sklepie
  turns:
    - speaker: Kasjer
      text_pl: Dzień dobry.
    - speaker: Volodymyr
      text_pl: Dzień dobry. Poproszę ten chleb i mleko.
    - speaker: Kasjer
      text_pl: Ile mleka? Jedno czy dwa?
    - speaker: Volodymyr
      text_pl: Jedno, proszę. Ile to kosztuje?
    - speaker: Kasjer
      text_pl: Dwanaście złotych i pięćdziesiąt groszy.
    - speaker: Volodymyr
      text_pl: Dobrze. Płacę kartą. Czy mogę dostać paragon?
    - speaker: Kasjer
      text_pl: Tak, proszę. Oto paragon.
    - speaker: Volodymyr
      text_pl: Dziękuję. Do widzenia.
    - speaker: Kasjer
      text_pl: Do widzenia. Miłego dnia!
key_lines:
  - text_pl: Poproszę ten chleb i mleko.
    explanation_ru: >
      Обычный выбор у кассы: Poproszę + винительный (Biernik). Указательное
      ten помогает показать конкретный хлеб на витрине — не *Daj… к кассиру.
  - text_pl: Ile mleka? / Jedno, proszę.
    explanation_ru: >
      Вопрос кассира про количество и короткий ответ: Jedno, proszę —
      без лишних слов.
  - text_pl: Ile to kosztuje?
    explanation_ru: >
      Базовый вопрос о цене. Ответ слушайте целиком: złotych и groszy
      как один числовой кусок.
  - text_pl: Płacę kartą. / Czy mogę dostać paragon?
    explanation_ru: >
      Оплата творительным (kartą / gotówką) и просьба о чеке — чтобы
      спокойно закрыть покупку.
pan_pani:
  summary_ru: >
    К кассиру-незнакомцу по умолчанию — pan/pani и спокойный сервисный тон:
    Poproszę…, Ile to kosztuje?, Dziękuję. Форма ty и резкое *Daj… —
    не к незнакомцу у кассы.
  form: "Poproszę… · Ile to kosztuje? · Płacę kartą / gotówką."
  examples_pl:
    - Poproszę ten chleb.
    - Ile to kosztuje?
    - Płacę kartą.
  counterexamples_pl:
    - "*Daj chleb." # резко
    - "*Skolko stoit?" # L1-калька
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      «Дайте / можна мені» → не *Daj / *Możno mnie. Тримайте
      Poproszę + Acc; «скільки коштує» → Ile to kosztuje?, не *stoit.
    rus: >
      «Можно мне» → не *Możno mnie; «сколько стоит» → Ile to kosztuje?,
      не *stoit. Kartą — творительный, не «на карту» / *kartę.
    bel: >
      «Дайце / можна мне» не робіць *Daj / *Możno mnie. Poproszę… і
      Ile to kosztuje? — асобныя рамкі; бел. «вы» ≠ wy да касіра.
grammar_points:
  - id: GP-A1-WS-CENA-ILOSC
    title_pl: Ile to kosztuje? / ilość
    summary_ru: >
      Два коротких куска у кассы: цена (zł) и количество товара.
    form: >
      Ile to kosztuje? → X złotych. Количество: jedno / dwa + rzeczownik.
      Оплата: płacę kartą / gotówką.
    meaning: >
      Согласовать цену и количество, чтобы завершить покупку.
    use: >
      Касса с коротким списком товаров; затем подтверждение и paragon.
    examples_pl:
      - Ile to kosztuje?
      - Jedno mleko, proszę.
      - Płacę kartą.
    counterexamples_pl:
      - "*Ile kosztuje to jest?" # сломанный порядок
      - "*Płacę karta." # без Ins
      - "*Dwa mleko." # согласование количества
    concept_ids:
      - GR-NUM-MONEY-01
      - GR-NUM-CARD-01
      - GR-CAS-ACC-01
    l1_notes:
      ukr: >
        Після Ile to kosztuje? слухайте złotych/groszy цілком.
        Kartą (Ins) ≠ «картою / на карту»; не *Płacę kartę.
      rus: >
        Не *Ile kosztuje to jest и не *stoit. Kartą — Ins, не *kartę /
        *na kartę. Jedno / dwa — готовый слот количества.
      bel: >
        Не пераносіце аканне ў сумы. Ile to kosztuje? і płacę kartą —
        цэлыя; не *kartę і не *na kartę.
l1_notes:
  ukr: >
    Пастка: «дайте / можна мені / скільки». Тримайте Poproszę + Acc,
    Ile to kosztuje?, kartą (Ins); з касиром — pan/pani.
  rus: >
    Пастка: «можно мне / сколько стоит / на карту». Целиком:
    Poproszę…, Ile to kosztuje?, płacę kartą — без ty у кассы.
  bel: >
    Пастка: «дайце / можна мне» і аканне ў сумах. Poproszę… /
    Ile to kosztuje? / kartą — асобныя польскія рамкі.
