kind: lesson
canonical_id: LES-A1-WS-01
slug: zakupy-przy-kasie
version: 8
status: DRAFT
title_pl: Zakupy przy kasie
sort_order: 1
situation_ru: >
  У кассы в небольшом магазине в Польше: хлеб и молоко. Назвать товары,
  количество, спросить цену, оплатить. Кассир — взрослый незнакомец;
  без ty и без резкого *Daj.
objective_ru: >
  Назвать товар и количество, спросить Ile to kosztuje?, подтвердить оплату
  kartą и поблагодарить — на pan/pani.
curriculum_links:
  scenarios:
