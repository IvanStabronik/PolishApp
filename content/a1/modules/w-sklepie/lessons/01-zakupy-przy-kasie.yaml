dialogue:
  title_pl: Przy kasie w sklepie
  turns:
    - speaker: Kasjer
      text_pl: Dzień dobry.
    - speaker: Volodymyr
      text_pl: Dzień dobry. Poproszę ten chleb i mleko.
    - speaker: Kasjer
      text_pl: Ile mleka? Jedno czy dwa?
    - speaker: Volodymyr
      text_pl: Jedno, proszę. Ile to kosztuje?
    - speaker: Kasjer
      text_pl: Dwanaście złotych i pięćdziesiąt groszy.
    - speaker: Volodymyr
      text_pl: Dobrze. Płacę kartą. Czy mogę dostać paragon?
    - speaker: Kasjer
      text_pl: Tak, proszę. Oto paragon.
    - speaker: Volodymyr
      text_pl: Dziękuję. Do widzenia.
    - speaker: Kasjer
      text_pl: Do widzenia. Miłego dnia!
key_lines:
  - text_pl: Poproszę ten chleb i mleko.
    explanation_ru: >
      Выбор товара: Poproszę + Acc; указательное ten помогает указать
      конкретный объект на кассе/витрине.
  - text_pl: Ile mleka? / Jedno, proszę.
    explanation_ru: >
      Количество: вопрос кассира и короткий ответ числительным/формой меры.
  - text_pl: Ile to kosztuje?
    explanation_ru: >
      Базовый вопрос о цене; ответ слушайте как целый числовой слот (zł / grosze).
  - text_pl: Płacę kartą. / Czy mogę dostać paragon?
    explanation_ru: >
      Оплата творительным (kartą) и просьба о чеке — закрытие транзакции.
pan_pani:
  summary_ru: >
    К кассиру-незнакомцу — только вежливый сервисный регистр: Poproszę…,
    Ile to kosztuje?, Dziękuję. Избегайте ty и резкого *Daj… у кассы.
  form: "Poproszę… · Ile to kosztuje? · Płacę kartą / gotówką."
  examples_pl:
    - Poproszę ten chleb.
    - Ile to kosztuje?
    - Płacę kartą.
  counterexamples_pl:
    - "*Daj chleb." # резко
    - "*Skolko stoit?" # L1-калька
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      Не ставте «дайте» як *Daj і не калькуйте «скільки коштує» дослівно.
      Тримайте Ile to kosztuje? і pan/pani до касира.
    rus: >
      «Сколько стоит» → Ile to kosztuje?, не *Skolko. Не используйте ty
      к кассиру; kartą — Ins, не «на карте».
    bel: >
      Не пераносьце «дайце / колькі каштуе» ў польскую калькай. Poproszę…
      і Ile to kosztuje? — асобныя рамкі; без ty да касіра.
grammar_points:
  - id: GP-A1-WS-CENA-ILOSC
    title_pl: Ile to kosztuje? / ilość
    summary_ru: >
      Числовые слоты покупки: цена (zł) и количество товара в короткой кассе.
    form: >
      Ile to kosztuje? → X złotych. Ilość: jedno / dwa + rzeczownik.
      Płatność: płacę kartą / gotówką.
    meaning: >
      Согласовать цену и количество, чтобы завершить обмен товар↔оплата.
    use: >
      Касса магазина с ≤10 позициями; затем подтверждение и paragon.
    examples_pl:
      - Ile to kosztuje?
      - Jedno mleko, proszę.
      - Płacę kartą.
    counterexamples_pl:
      - "*Ile kosztuje to jest?" # сломанный порядок
      - "*Płacę karta." # без Ins
      - "*Dwa mleko." # согласование количества
    concept_ids:
      - GR-NUM-MONEY-01
      - GR-NUM-CARD-01
      - GR-CAS-ACC-01
    l1_notes:
      ukr: >
        Числа 5+ часто тягнуть Gen — на A1 тримайте готові відповіді каси
        (dwanaście złotych). Не *Skilky kosztuje.
      rus: >
        Не калькируйте «сколько стоит это» порядком слов. Kartą — Ins.
        Следите за одно/два в ответе о количестве.
      bel: >
        Аканне ў сумах на пісьме не пераносіце. Вучыце Ile to kosztuje?
        і płacę kartą цэлымі формуламі.
l1_notes:
  ukr: >
    Урок про касу: Poproszę + Acc, кількість, Ile to kosztuje?, оплата
    kartą. Не калькуйте «скільки коштує / дайте»; pan/pani до касира.
  rus: >
    Фокус: цена и количество без L1-порядка слов и без ty у кассы.
    Зафиксируйте Ile to kosztuje? и płacę kartą как целые рамки.
  bel: >
    Асобны акцэнт BEL: не капіюйце рускія нотаткі. Касавыя формулы
    польскія; пісьмо сум без акання; без «ты» да касіра.
