dialogue:
  title_pl: Przy kasie w sklepie
  turns:
    - speaker: Kasjer
      text_pl: Dzień dobry.
    - speaker: Volodymyr
      text_pl: Dzień dobry. Poproszę ten chleb i mleko.
    - speaker: Kasjer
      text_pl: Ile mleka? Jedno czy dwa?
    - speaker: Volodymyr
      text_pl: Jedno, proszę. Ile to kosztuje?
    - speaker: Kasjer
      text_pl: Dwanaście złotych i pięćdziesiąt groszy.
    - speaker: Volodymyr
      text_pl: Dobrze. Płacę kartą. Czy mogę dostać paragon?
    - speaker: Kasjer
      text_pl: Tak, proszę. Oto paragon.
    - speaker: Volodymyr
      text_pl: Dziękuję. Do widzenia.
    - speaker: Kasjer
      text_pl: Do widzenia. Miłego dnia!
key_lines:
  - text_pl: Poproszę ten chleb i mleko.
    explanation_ru: >
      Обычный выбор у кассы: Poproszę + винительный (Biernik). Указательное
      ten помогает показать конкретный хлеб на витрине — не *Daj… к кассиру.
  - text_pl: Ile mleka? / Jedno, proszę.
    explanation_ru: >
      Вопрос кассира про количество и короткий ответ: Jedno, proszę —
      без лишних слов.
  - text_pl: Ile to kosztuje?
    explanation_ru: >
      Базовый вопрос о цене. Ответ слушайте целиком: złotych и groszy
      как один числовой кусок.
  - text_pl: Płacę kartą. / Czy mogę dostać paragon?
    explanation_ru: >
      Оплата творительным (kartą / gotówką) и просьба о чеке — чтобы
      спокойно закрыть покупку.
pan_pani:
  summary_ru: >
    К кассиру-незнакомцу по умолчанию — pan/pani и спокойный сервисный тон:
    Poproszę…, Ile to kosztuje?, Dziękuję. Форма ty и резкое *Daj… —
    не к незнакомцу у кассы.
  form: "Poproszę… · Ile to kosztuje? · Płacę kartą / gotówką."
  examples_pl:
    - Poproszę ten chleb.
    - Ile to kosztuje?
    - Płacę kartą.
  counterexamples_pl:
    - "*Daj chleb." # резко
    - "*Skolko stoit?" # L1-калька
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      «Дайте / скільки коштує» → не *Daj / *Skolko. У каси —
      Poproszę + Acc, Ile to kosztuje?; до касира pan/pani, не ty.
    rus: >
      «Сколько стоит» → Ile to kosztuje?, не *Skolko. Не говорите ty
      кассиру; kartą — творительный в формуле оплаты, не «на карте».
    bel: >
      «Дайце / колькі каштуе» не робіць рэзкі *Daj. Poproszę… +
      Ile to kosztuje? — асобныя рамкі; бел. «вы» ≠ wy да касіра.
grammar_points:
  - id: GP-A1-WS-CENA-ILOSC
    title_pl: Ile to kosztuje? / ilość
    summary_ru: >
      Два коротких куска у кассы: цена (zł) и количество товара.
    form: >
      Ile to kosztuje? → X złotych. Количество: jedno / dwa + rzeczownik.
      Оплата: płacę kartą / gotówką.
    meaning: >
      Согласовать цену и количество, чтобы завершить покупку.
    use: >
      Касса с коротким списком товаров; затем подтверждение и paragon.
    examples_pl:
      - Ile to kosztuje?
      - Jedno mleko, proszę.
      - Płacę kartą.
    counterexamples_pl:
      - "*Ile kosztuje to jest?" # сломанный порядок
      - "*Płacę karta." # без Ins
      - "*Dwa mleko." # согласование количества
    concept_ids:
      - GR-NUM-MONEY-01
      - GR-NUM-CARD-01
      - GR-CAS-ACC-01
    l1_notes:
      ukr: >
        Після Ile to kosztuje? — готова відповідь каси (dwanaście złotych),
        не *Skilky. Kartą (Ins оплати) ≠ укр. «картою / на карту».
      rus: >
        Не калькируйте «сколько стоит это» порядком слов. Kartą — Ins.
        Следите за jedno / dwa в ответе о количестве.
      bel: >
        Acc пасля Poproszę; аканне ў сумах на пісьме не пераносіце.
        Ile to kosztuje? і płacę kartą — цэлыя формулы.
l1_notes:
  ukr: >
    Не калькуйте «дайте / скільки коштує». Тримайте Poproszę + Acc,
    Ile to kosztuje?, Kartą; з касиром — pan/pani, не ty.
  rus: >
    Цена и количество без L1-порядка слов и без ty у кассы. Запомните
    Ile to kosztuje? и płacę kartą целиком.
  bel: >
    Не спадзявайцеся на «і так зразумеюць». Poproszę… / Ile to kosztuje? /
    Kartą — асобныя польскія рамкі; пісьмо сум без акання.
