dialogue:
  title_pl: Samodzielne zakupy
  turns:
    - speaker: Kasjer
      text_pl: Dzień dobry. Co podać?
    - speaker: Larysa
      text_pl: Poproszę ten chleb, mleko i trzy bułki.
    - speaker: Kasjer
      text_pl: Jedno mleko?
    - speaker: Larysa
      text_pl: Tak, jedno. I jeszcze torbę, proszę.
    - speaker: Kasjer
      text_pl: Razem osiemnaście złotych.
    - speaker: Larysa
      text_pl: Dobrze. Płacę kartą. Czy mogę dostać paragon?
    - speaker: Kasjer
      text_pl: Oczywiście. Proszę.
    - speaker: Larysa
      text_pl: Dziękuję. Do widzenia.
key_lines:
  - text_pl: Poproszę ten chleb, mleko i trzy bułki.
    explanation_ru: Самостоятельный выбор нескольких товаров.
  - text_pl: Tak, jedno.
    explanation_ru: Короткое подтверждение количества.
  - text_pl: I jeszcze torbę, proszę.
    explanation_ru: Добавление последней позиции.
  - text_pl: Czy mogę dostać paragon?
    explanation_ru: Полная просьба о чеке.
pan_pani:
  summary_ru: С незнакомым взрослым собеседником сохраняйте pan/pani и третье лицо; нейтральные
    просьбы и благодарность важнее буквального переноса форм L1.
  form: Poproszę… · jeszcze… · razem… · płacę…
  examples_pl: &a1
    - Poproszę ten chleb i mleko.
    - Tak, jedno.
    - I jeszcze torbę, proszę.
  counterexamples_pl:
    - "*Ty mi powiedz."
    - "*Daj mi to."
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: Відпрацьовуйте польську рамку «Poproszę… · jeszcze… · razem… · płacę…» цілісно; не складайте її
      дослівно з українських слів.
    rus: Отрабатывайте польскую рамку «Poproszę… · jeszcze… · razem… · płacę…» целиком, без дословной
      кальки с русского.
    bel: Адпрацоўвайце польскую рамку «Poproszę… · jeszcze… · razem… · płacę…» цалкам; не складайце яе
      даслоўна з беларускай.
grammar_points:
  - id: GP-A1-WS-L3
    title_pl: Pełna lista zakupów
    summary_ru: Провести покупку от выбора до чека, реагируя на вопрос кассира без готовой подсказки.
    form: Poproszę A, B i liczbę C. Tak, jedno/dwa. I jeszcze…
    meaning: Связать знакомые A1-реплики в понятное действие внутри ситуации.
    use: Вы самостоятельно выбираете несколько товаров, корректируете количество и завершаете покупку.
    examples_pl: *a1
    counterexamples_pl:
      - "*Ty daj."
      - "*Ja nie rozumieć."
    concept_ids:
      - GR-CAS-ACC-01
      - GR-NUM-MONEY-01
      - GR-NUM-CARD-01
    l1_notes:
      ukr: Відпрацьовуйте польську рамку «Poproszę A, B i liczbę C. Tak, jedno/dwa. I jeszcze…» цілісно;
        не складайте її дослівно з українських слів.
      rus: Отрабатывайте польскую рамку «Poproszę A, B i liczbę C. Tak, jedno/dwa. I jeszcze…» целиком,
        без дословной кальки с русского.
      bel: Адпрацоўвайце польскую рамку «Poproszę A, B i liczbę C. Tak, jedno/dwa. I jeszcze…» цалкам; не
        складайце яе даслоўна з беларускай.
