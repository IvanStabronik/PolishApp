kind: lesson
canonical_id: LES-A1-WS-03
slug: samodzielne-zakupy
version: 6
status: DRAFT
title_pl: Samodzielne zakupy
sort_order: 3
situation_ru: >
  Вы у кассы сами: несколько товаров, уточнение количества, оплата и чек.
  Кассир может переспросить — отвечайте коротко, без готовой подсказки
  с экрана. Кассир — взрослый незнакомец; речь спокойная.
objective_ru: >
  Пройти покупку от списка до paragon: назвать товары, подтвердить
  количество, оплатить и попросить чек — на pan/pani, без ty к кассиру.
curriculum_links:
  scenarios:
    - SCN-A1-SHOP-01
  functions:
    - FN-A1-TRANS-01
    - FN-A1-QUANT-01
    - FN-A1-ASK-01
    - FN-A1-ADDRESS-01
    - FN-A1-CONFIRM-01
    - FN-A1-THANKS-01
  lex_bundles:
    - LEX-A1-SERVICE
    - LEX-A1-MONEY
  concepts:
    - GR-CAS-ACC-01
    - GR-NUM-MONEY-01
    - GR-NUM-CARD-01
    - PRAG-PAN-01
dialogue:
  title_pl: Samodzielne zakupy
  turns:
    - speaker: Kasjer
      text_pl: Dzień dobry. Co podać?
    - speaker: Larysa
      text_pl: Poproszę ten chleb, mleko i trzy bułki.
    - speaker: Kasjer
      text_pl: Jedno mleko?
    - speaker: Larysa
      text_pl: Tak, jedno. I jeszcze torbę, proszę.
    - speaker: Kasjer
      text_pl: Razem osiemnaście złotych.
    - speaker: Larysa
      text_pl: Dobrze. Płacę kartą. Czy mogę dostać paragon?
    - speaker: Kasjer
      text_pl: Oczywiście. Proszę.
    - speaker: Larysa
      text_pl: Dziękuję. Do widzenia.
key_lines:
  - text_pl: Poproszę ten chleb, mleko i trzy bułki.
    explanation_ru: >
      Список у кассы в одной реплике: Poproszę + товары (Acc) и число.
      Союз i связывает позиции — не *Daj… и не набор слов без рамки.
  - text_pl: Tak, jedno.
    explanation_ru: >
      Короткий ответ на уточнение кассира: Tak, jedno —
      без лишних слов и без ty.
  - text_pl: I jeszcze torbę, proszę.
    explanation_ru: >
      Добавить позицию в конце: I jeszcze…, proszę —
      спокойно, без *Daj mi.
  - text_pl: Czy mogę dostać paragon?
    explanation_ru: >
      Полная просьба о чеке — закрыть покупку без резкости к кассиру.
pan_pani:
  summary_ru: >
    К кассиру-незнакомцу — pan/pani и спокойный сервисный тон:
    Poproszę…, jeszcze…, Razem…, płacę…. Форма ty и резкое *Daj…
    — не к незнакомцу у кассы.
  form: Poproszę… · jeszcze… · razem… · płacę…
  examples_pl: &a1
    - Poproszę ten chleb i mleko.
    - Tak, jedno.
    - I jeszcze torbę, proszę.
  counterexamples_pl:
    - "*Ty mi powiedz." # ty к кассиру
    - "*Daj mi to." # резко
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      Пастка: зібрати список без Poproszę або відповісти *jeden на Jedno mleko?
      Тримайте Poproszę… → Tak, jedno → I jeszcze… → paragon.
    rus: >
      Пастка: калька «ещё» без jeszcze; *jeden вместо jedno для mleko;
      список без рамки Poproszę.
    bel: >
      Пастка: *Daj / «яшчэ» без jeszcze; *jeden замест jedno;
      аканне ў Razem… не пераносіце.
grammar_points:
  - id: GP-A1-WS-L3
    title_pl: Pełna lista zakupów
    summary_ru: >
      Связать знакомые реплики в одну покупку: список, уточнение,
      сумма, оплата и чек.
    form: Poproszę A, B i liczbę C. Tak, jedno/dwa. I jeszcze…
    meaning: >
      Провести покупку от выбора до чека, отвечая на вопрос кассира.
    use: >
      Самостоятельный список у кассы; короткое подтверждение количества;
      итог и оплата.
    examples_pl: *a1
    counterexamples_pl:
      - "*Ty daj." # грубо + ty
      - "*Ja nie rozumieć." # сломанный глагол
    concept_ids:
      - GR-CAS-ACC-01
      - GR-NUM-MONEY-01
      - GR-NUM-CARD-01
    l1_notes:
      ukr: >
        Acc і liczba після Poproszę. Tak, jedno (не *jeden для mleko);
        I jeszcze… цілком — не «можна мені ще».
      rus: >
        Не *jeden к mleko и не «ещё» без jeszcze. Список — одна рамка Poproszę…
        с i между позициями.
      bel: >
        Tak, jedno / I jeszcze… вучыце цэлымі; не *jeden і не калька «дайце яшчэ».
        Acc пасля Poproszę.
l1_notes:
  ukr: >
    Самі: Poproszę X, Y i Z → Tak, jedno → I jeszcze… → Kartą / paragon.
    Пастки: *jeden, список без Poproszę, *Daj torbę.
  rus: >
    Полный заказ без L1-сборки: Poproszę…, Tak, jedno (не *jeden),
    I jeszcze…, потом оплата и чек.
  bel: >
    Самі цэлымі рамкамі. Пасткі: *jeden, «яшчэ» без jeszcze, *Daj.
    Без ty да касіра.
