dialogue:
  title_pl: Samodzielne zakupy
  turns:
    - speaker: Kasjer
      text_pl: Dzień dobry. Co podać?
    - speaker: Larysa
      text_pl: Poproszę ten chleb, mleko i trzy bułki.
    - speaker: Kasjer
      text_pl: Jedno mleko?
    - speaker: Larysa
      text_pl: Tak, jedno. I jeszcze torbę, proszę.
    - speaker: Kasjer
      text_pl: Razem osiemnaście złotych.
    - speaker: Larysa
      text_pl: Dobrze. Płacę kartą. Czy mogę dostać paragon?
    - speaker: Kasjer
      text_pl: Oczywiście. Proszę.
    - speaker: Larysa
      text_pl: Dziękuję. Do widzenia.
key_lines:
  - text_pl: Poproszę ten chleb, mleko i trzy bułki.
    explanation_ru: >
      Список у кассы в одной реплике: Poproszę + товары (Acc) и число.
      Союз i связывает позиции — не *Daj… и не набор слов без рамки.
  - text_pl: Tak, jedno.
    explanation_ru: >
      Короткий ответ на уточнение кассира: Tak, jedno —
      без лишних слов и без ty.
  - text_pl: I jeszcze torbę, proszę.
    explanation_ru: >
      Добавить позицию в конце: I jeszcze…, proszę —
      спокойно, без *Daj mi.
  - text_pl: Czy mogę dostać paragon?
    explanation_ru: >
      Полная просьба о чеке — закрыть покупку без резкости к кассиру.
pan_pani:
  summary_ru: >
    К кассиру-незнакомцу — pan/pani и спокойный сервисный тон:
    Poproszę…, jeszcze…, Razem…, płacę…. Форма ty и резкое *Daj…
    — не к незнакомцу у кассы.
  form: Poproszę… · jeszcze… · razem… · płacę…
  examples_pl: &a1
    - Poproszę ten chleb i mleko.
    - Tak, jedno.
    - I jeszcze torbę, proszę.
  counterexamples_pl:
    - "*Ty mi powiedz." # ty к кассиру
    - "*Daj mi to." # резко
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      Не збирайте покупку з «дайте». Тримайте
      Poproszę… → Tak, jedno → I jeszcze… → płacę…; «ти» до касира —
      лише якщо сам запропонував.
    rus: >
      Не собирайте «попрошу / ещё / итого / плачу» дословной калькой.
      Poproszę… и I jeszcze… — польские рамки; без ty к кассиру.
    bel: >
      Не збірайце пакупку з «дайце». Трымайце
      Poproszę… → Tak, jedno → I jeszcze… → płacę…; да касіра не ty,
      пакуль ён сам не прапануе.
grammar_points:
  - id: GP-A1-WS-L3
    title_pl: Pełna lista zakupów
    summary_ru: >
      Связать знакомые реплики в одну покупку: список, уточнение,
      сумма, оплата и чек.
    form: Poproszę A, B i liczbę C. Tak, jedno/dwa. I jeszcze…
    meaning: >
      Провести покупку от выбора до чека, отвечая на вопрос кассира.
    use: >
      Самостоятельный список у кассы; короткое подтверждение количества;
      итог и оплата.
    examples_pl: *a1
    counterexamples_pl:
      - "*Ty daj." # грубо + ty
      - "*Ja nie rozumieć." # сломанный глагол
    concept_ids:
      - GR-CAS-ACC-01
      - GR-NUM-MONEY-01
      - GR-NUM-CARD-01
    l1_notes:
      ukr: >
        Після Poproszę — Acc і liczba. Tak, jedno і I jeszcze… цілими;
        не *Daj і не «можна мені ще».
      rus: >
        Не калькируйте весь заказ порядком слов из L1. Jedno / dwa —
        готовый слот; I jeszcze… добавляет позицию.
      bel: >
        Acc пасля Poproszę. Tak, jedno / I jeszcze… вучыце цэлымі;
        не калька «дайце яшчэ»; аканне ў сумах на пісьме не пераносіце.
l1_notes:
  ukr: >
    Самі: Poproszę X, Y i Z, Tak, jedno, I jeszcze…, ціна й Kartą.
    Без «дайте» і без ty до касира.
  rus: >
    Полный заказ у кассы без L1-сборки и без ty. Запомните
    Poproszę…, Tak, jedno, I jeszcze… и просьбу о paragon целиком.
  bel: >
    Самі правядзіце пакупку цэлымі рамкамі: Poproszę… / Tak, jedno /
    I jeszcze… / Kartą. Без калькі «дайце» і без ty да касіра.
