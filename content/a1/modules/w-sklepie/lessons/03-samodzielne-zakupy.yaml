version: 5
status: DRAFT
title_pl: Samodzielne zakupy
sort_order: 3
situation_ru: >
  Вы у кассы сами: несколько товаров, уточнение количества, оплата и чек.
  Кассир может переспросить — отвечайте коротко, без готовой подсказки
  с экрана. Кассир — взрослый незнакомец; речь спокойная.
objective_ru: >
  Пройти покупку от списка до paragon: назвать товары, подтвердить
  количество, оплатить и попросить чек — на pan/pani, без ty к кассиру.
