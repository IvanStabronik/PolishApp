kind: lesson
canonical_id: LES-A1-UR-02
slug: brakujacy-dokument-i-formularz
version: 5
status: DRAFT
title_pl: Brakujący dokument i formularz
sort_order: 2
situation_ru: >
  У окошка служащий говорит, что чего-то не хватает (brakuje…). Нужно
  спокойно подтвердить, уточнить полный комплект и попросить formularz —
  без паники и без ty.
objective_ru: >
  Понять сообщение о недостающем документе, спросить Czego jeszcze
  potrzebuję? и вежливо попросить бланк (Czy mogę prosić o formularz?).
