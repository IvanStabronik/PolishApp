dialogue:
  title_pl: Brakujący dokument i formularz
  turns:
    - speaker: Urzędniczka
      text_pl: Dzień dobry. Czy ma pan wniosek i paszport?
    - speaker: Iwan
      text_pl: Mam paszport. Nie mam wniosku.
    - speaker: Urzędniczka
      text_pl: Brakuje wniosku i jednego zdjęcia.
    - speaker: Iwan
      text_pl: Rozumiem. Czego jeszcze potrzebuję?
    - speaker: Urzędniczka
      text_pl: Tylko formularza i zdjęcia.
    - speaker: Iwan
      text_pl: Czy mogę prosić o formularz?
    - speaker: Urzędniczka
      text_pl: Tak, proszę. Formularz jest tutaj.
    - speaker: Iwan
      text_pl: Dziękuję. Wypełnię go teraz.
key_lines:
  - text_pl: Nie mam wniosku.
    explanation_ru: Ясное сообщение об отсутствующем документе.
  - text_pl: Brakuje jednego zdjęcia.
    explanation_ru: Служащий называет недостающую позицию.
  - text_pl: Czego jeszcze potrzebuję?
    explanation_ru: Вежливое уточнение полного комплекта.
  - text_pl: Czy mogę prosić o formularz?
    explanation_ru: Запрос нужного бланка.
pan_pani:
  summary_ru: С незнакомым взрослым собеседником сохраняйте pan/pani и третье лицо; нейтральные
    просьбы и благодарность важнее буквального переноса форм L1.
  form: brakuje · czego potrzebuję · proszę o formularz
  examples_pl: &a1
    - Nie mam wniosku.
    - Brakuje zdjęcia.
    - Czego jeszcze potrzebuję?
  counterexamples_pl:
