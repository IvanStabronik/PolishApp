  concepts:
    - PRAG-PAN-01
    - GR-TV-AGR-01
    - GR-CAS-ACC-01
    - GR-TNS-PRS-01
dialogue:
  title_pl: Brakujący dokument i formularz
  turns:
    - speaker: Urzędniczka
      text_pl: Dzień dobry. Czy ma pan wniosek i paszport?
    - speaker: Iwan
      text_pl: Mam paszport. Nie mam wniosku.
    - speaker: Urzędniczka
      text_pl: Brakuje wniosku i jednego zdjęcia.
    - speaker: Iwan
      text_pl: Rozumiem. Czego jeszcze potrzebuję?
    - speaker: Urzędniczka
      text_pl: Tylko formularza i zdjęcia.
    - speaker: Iwan
      text_pl: Czy mogę prosić o formularz?
    - speaker: Urzędniczka
      text_pl: Tak, proszę. Formularz jest tutaj.
    - speaker: Iwan
      text_pl: Dziękuję. Wypełnię go teraz.
key_lines:
  - text_pl: Nie mam wniosku.
    explanation_ru: >
      Честно сказать, чего нет: Nie mam + Gen. Служащий сразу видит пробел
      в комплекте.
  - text_pl: Brakuje jednego zdjęcia.
    explanation_ru: >
      Со стороны окошка: Brakuje + Gen. Это не упрёк — перечень того, чего
      не хватает.
  - text_pl: Czego jeszcze potrzebuję?
    explanation_ru: >
      Спокойное уточнение: чего ещё не хватает до полного комплекта.
  - text_pl: Czy mogę prosić o formularz?
    explanation_ru: >
      Вежливая просьба о бланке. Короче тоже можно: Proszę o formularz.
pan_pani:
  summary_ru: >
    К служащему — pan/pani. Сообщить о нехватке, уточнить комплект и попросить
    бланк можно спокойно; приказы вроде *Daj mi… у окошка не к месту.
  form: "Nie mam… · Brakuje… · Czego potrzebuję? · Proszę o formularz."
  examples_pl: &a1
    - Nie mam wniosku.
    - Brakuje zdjęcia.
    - Czego jeszcze potrzebuję?
  counterexamples_pl:
    - "*Ty mi powiedz." # грубо к служащему
    - "*Daj mi to." # приказ вместо просьбы
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      «Дай мені» → не *Daj mi…. Nie mam… / Brakuje… + Gen; просьба —
      Proszę o… / Czy mogę prosić o….
    rus: >
      Не *Daj mi formularz и не ty к служащему. Brakuje + Gen; просьба —
      Proszę o… или Czy mogę prosić o….
    bel: >
      «Дай мне» не робіць *Daj mi…. Gen пасля nie mam / brakuje;
      просьба — Proszę o…, не прыказ.
grammar_points:
  - id: GP-A1-UR-L2
    title_pl: Brak i uzupełnienie dokumentów
    summary_ru: >
      Два хода у окошка: понять Brakuje… / Nie mam… и спокойно добрать
      комплект (уточнение + formularz).
    form: >
      Mam / nie mam + Gen. Brakuje + Gen. Czego potrzebuję?
      Proszę o… / Czy mogę prosić o formularz?
    meaning: >
      Сориентироваться, когда чего-то не хватает, и спокойно закрыть пробел.
    use: >
      Служащий называет недостающее; вы уточняете комплект и просите бланк.
    examples_pl: *a1
    counterexamples_pl:
      - "*Ty daj." # приказ
      - "*Ja nie rozumieć." # ломает глагол
    concept_ids:
      - PRAG-PAN-01
      - GR-TV-AGR-01
      - GR-CAS-ACC-01
    l1_notes:
      ukr: >
        *Nie mam wniosek → Nie mam wniosku (Gen). Не *Daj…; уточнення —
        Czego jeszcze potrzebuję?
      rus: >
        «У меня нет» → Nie mam + Gen, не *Nie mam wniosek. Brakuje тоже
        с Gen. Просьба — Proszę o…, не приказ.
      bel: >
        Назоўны пасля nie mam / brakuje — пастка. Gen + Proszę o…;
        без ty да служачай.
l1_notes:
  ukr: >
    Не калькуйте «дай / у мене немає + називний». Тримайте Nie mam… /
    Brakuje… + Gen, Czego jeszcze…?, Proszę o formularz.
  rus: >
    Фокус: Gen после nie mam / brakuje и спокойная просьба о бланке —
    без ty к служащему.
  bel: >
    Не спадзявайцеся на «і так зразумеюць». Nie mam… / Brakuje… + Gen;
    просьба — Proszę o…, не «дай».
