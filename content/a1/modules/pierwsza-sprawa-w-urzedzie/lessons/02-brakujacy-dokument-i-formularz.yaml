  l1_notes:
    ukr: Відпрацьовуйте польську рамку «brakuje · czego potrzebuję · proszę o formularz» цілісно; не
      складайте її дослівно з українських слів.
    rus: Отрабатывайте польскую рамку «brakuje · czego potrzebuję · proszę o formularz» целиком, без
      дословной кальки с русского.
