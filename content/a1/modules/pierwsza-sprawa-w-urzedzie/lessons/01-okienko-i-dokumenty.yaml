dialogue:
  title_pl: Przy okienku
  turns:
    - speaker: Urzędnik
      text_pl: Dzień dobry. W czym mogę pomóc?
    - speaker: Oksana
      text_pl: Dzień dobry. Przyszłam w sprawie meldunku.
    - speaker: Urzędnik
      text_pl: Proszę. Czy ma pani dokumenty?
    - speaker: Oksana
      text_pl: Tak. Oto mój paszport i wniosek.
    - speaker: Urzędnik
      text_pl: Dziękuję. Brakuje formularza. Proszę wypełnić ten blankiet.
    - speaker: Oksana
      text_pl: Dobrze. Czy mogę prosić o formularz?
    - speaker: Urzędnik
      text_pl: Proszę. Oto formularz.
    - speaker: Oksana
      text_pl: Dziękuję. Nazywam się Oksana Melnyk.
    - speaker: Urzędnik
      text_pl: Rozumiem. Proszę czekać na numer.
    - speaker: Oksana
      text_pl: Dobrze. Dziękuję. Do widzenia.
    - speaker: Urzędnik
      text_pl: Do widzenia.
key_lines:
  - text_pl: Przyszłam w sprawie meldunku.
    explanation_ru: >
      Цель визита одной фразой: Przyszedłem/Przyszłam w sprawie + Gen.
      Род прошедшего согласуется с говорящим; не опускайте w sprawie….
  - text_pl: Oto mój paszport i wniosek.
    explanation_ru: >
      Передача документов: Oto + названные позиции. Служащий должен понять
      комплект без догадок.
  - text_pl: Czy mogę prosić o formularz?
    explanation_ru: >
      Просьба о бланке в официальном регистре; альтернатива — Proszę o formularz.
  - text_pl: Nazywam się… / Dziękuję. Do widzenia.
    explanation_ru: >
      Идентификация по запросу и вежливое закрытие контакта у окошка.
pan_pani:
  summary_ru: >
    В urzędzie к служащему-незнакомцу — только pan/pani и 3-е лицо в обращении
    к вам со стороны персонала (Czy ma pani…?). Форма ty и cześć недопустимы
    на первом визите у окошка.
  form: "Przyszedłem / Przyszłam w sprawie… · Oto dokumenty · Proszę o formularz."
  examples_pl:
    - Przyszłam w sprawie meldunku.
    - Oto mój paszport.
    - Czy mogę prosić o formularz?
  counterexamples_pl:
    - "*Cześć, ja tu w sprawie." # неверный регистр
    - "*Daj formularz." # резко к служащему
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      Українське «ви» не копіюйте як wy + 2 ос. мн. до urzędnika. Тримайте
      pan/pani; «ти» і cześć у першому візиті до окошка — помилка регістру.
      Przyszłam / Przyszedłem узгоджуйте з власною статтю.
    rus: >
      «Вы» + 2 л. мн. (*Вы можете…?*) к служащему — типичная ошибка.
      К вам скажут Czy ma pani…? (3 л.). Не *Daj formularz; цель — w sprawie….
    bel: >
      Не пераносьце бел. «вы» як wy да служачага. Афіцыйны рэгістр —
      pan/pani; Przyszłam/Przyszedłem + w sprawie… без калькі «па справе»
      з няправільным склонам.
grammar_points:
  - id: GP-A1-UR-SPRAWA-DOCS
    title_pl: w sprawie… · dokumenty · formularz
    summary_ru: >
      Цель визита и документооборот у окошка: w sprawie + Gen, Oto + документы,
      prośba o formularz.
    form: >
      Przyszedłem / Przyszłam w sprawie + Gen. Oto + Acc (paszport, wniosek).
      Proszę o formularz / Czy mogę prosić o formularz?
    meaning: >
      Сориентировать служащего и обеспечить передачу/получение документов.
    use: >
      Короткий визит к одному okienku без апелляций; затем ожидание numeru.
    examples_pl:
      - Przyszłam w sprawie meldunku.
      - Oto mój paszport i wniosek.
      - Czy mogę prosić o formularz?
    counterexamples_pl:
      - "*Przyszłam w sprawa." # без Gen
      - "*Daj dokumenty." # неверный регистр
      - "*Ja tutaj dla PESEL." # L1-калька цели
    concept_ids:
      - GR-CAS-ACC-01
      - GR-TNS-PRS-01
      - PRAG-PAN-01
      - GR-TV-AGR-01
    l1_notes:
      ukr: >
        Після w sprawie потрібен Gen (*meldunku*), не називний. Не *для PESEL
        замість w sprawie…. Рід: Przyszłam / Przyszedłem.
      rus: >
        «По делу» → w sprawie + Gen, не *w sprawa / *dla PESEL. Род прошедшего
        согласуйте; документы называйте явно (Oto…).
      bel: >
        Не калькуйце «па справе» без Gen. Трымайце Przyszłam/Przyszedłem і
        Oto… як цэлыя рамкі; без ty да служачага.
l1_notes:
  ukr: >
    Урок про перше вікно urzędu: Przyszłam/Przyszedłem w sprawie…, Oto
    dokumenty, prośba o formularz. Не cześć / ty; pan/pani обовʼязковий.
  rus: >
    Фокус: цель визита одной фразой и передача документов без ty к служащему.
    Запомните w sprawie + Gen и Oto…; род прошедшего — по говорящему.
  bel: >
    Асобны акцэнт BEL: не капіюйце рускія нотаткі. Афіцыйныя рамкі польскія;
    пісьмо назваў дакументаў без акання; без «ты» да urzędnika.
