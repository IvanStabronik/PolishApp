slug: okienko-i-dokumenty
version: 1
status: DRAFT
title_pl: Okienko i dokumenty
sort_order: 1
situation_ru: >
  Вы впервые подошли к окошку urzędu в Польше. Нужно поздороваться, назвать
  цель визита (sprawa), передать документы и при необходимости попросить
  formularz. Служащий — взрослый незнакомец; регистр pan/pani обязателен.
objective_ru: >
  Открыть контакт, сказать Przyszedłem/Przyszłam w sprawie…, передать
  dokumenty, попросить formularz при необходимости и закрыть визит —
  удерживая официальный pan/pani.
