dialogue:
  title_pl: Przy okienku
  turns:
    - speaker: Urzędnik
      text_pl: Dzień dobry. W czym mogę pomóc?
    - speaker: Oksana
      text_pl: Dzień dobry. Przyszłam w sprawie meldunku.
    - speaker: Urzędnik
      text_pl: Proszę. Czy ma pani dokumenty?
    - speaker: Oksana
      text_pl: Tak. Oto mój paszport i wniosek.
    - speaker: Urzędnik
      text_pl: Dziękuję. Brakuje formularza. Proszę wypełnić ten blankiet.
    - speaker: Oksana
      text_pl: Dobrze. Czy mogę prosić o formularz?
    - speaker: Urzędnik
      text_pl: Proszę. Oto formularz.
    - speaker: Oksana
      text_pl: Dziękuję. Nazywam się Oksana Melnyk.
    - speaker: Urzędnik
      text_pl: Rozumiem. Proszę czekać na numer.
    - speaker: Oksana
      text_pl: Dobrze. Dziękuję. Do widzenia.
    - speaker: Urzędnik
      text_pl: Do widzenia.
key_lines:
  - text_pl: Przyszłam w sprawie meldunku.
    explanation_ru: >
      Цель визита одной фразой: Przyszedłem/Przyszłam w sprawie + Gen.
      Род прошедшего — по говорящему; не опускайте w sprawie….
  - text_pl: Oto mój paszport i wniosek.
    explanation_ru: >
      Передача документов: Oto + то, что вы кладёте на стол. Служащий
      сразу видит комплект — без догадок.
  - text_pl: Czy mogę prosić o formularz?
    explanation_ru: >
      Спокойная просьба о бланке. Короче тоже можно: Proszę o formularz.
  - text_pl: Nazywam się… / Dziękuję. Do widzenia.
    explanation_ru: >
      Назвать себя, если спросили, и спокойно закрыть разговор у окошка.
pan_pani:
  summary_ru: >
    В urzędzie к служащему-незнакомцу — pan/pani. К вам обратятся в 3-м лице
    (Czy ma pani…?). Форма ty и cześć на первом визите у окошка — не к месту.
  form: "Przyszedłem / Przyszłam w sprawie… · Oto dokumenty · Proszę o formularz."
  examples_pl:
    - Przyszłam w sprawie meldunku.
    - Oto mój paszport.
    - Czy mogę prosić o formularz?
  counterexamples_pl:
    - "*Cześć, ja tu w sprawie." # неверный регистр
    - "*Daj formularz." # резко к служащему
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      «Для PESEL / по справі» → w sprawie + Gen, не *dla meldunku і не
      називний *w sprawa. pan/pani, не cześć / ty у першому візиті.
    rus: >
      «По делу / для PESEL» → w sprawie + Gen, не *w sprawa / *dla meldunku.
      К вам — Czy ma pani…? (3 л.); не *Daj formularz.
    bel: >
      «Па справе / для PESEL» не робіць *w sprawa / *dla meldunku.
      pan/pani + w sprawie… + Gen; без cześć / ty да служачага.
grammar_points:
  - id: GP-A1-UR-SPRAWA-DOCS
    title_pl: w sprawie… · dokumenty · formularz
    summary_ru: >
      Два коротких куска у окошка: цель визита (w sprawie + Gen) и документы
      (Oto…, prośba o formularz).
    form: >
      Przyszedłem / Przyszłam w sprawie + Gen. Oto + Acc (paszport, wniosek).
      Proszę o formularz / Czy mogę prosić o formularz?
    meaning: >
      Сориентировать служащего и спокойно передать или получить документы.
    use: >
      Короткий визит к одному okienku; затем ожидание numeru.
    examples_pl:
      - Przyszłam w sprawie meldunku.
      - Oto mój paszport i wniosek.
      - Czy mogę prosić o formularz?
    counterexamples_pl:
      - "*Przyszłam w sprawa." # без Gen
      - "*Daj dokumenty." # неверный регистр
      - "*Ja tutaj dla PESEL." # L1-калька цели
    concept_ids:
      - GR-CAS-ACC-01
      - GR-TNS-PRS-01
      - PRAG-PAN-01
      - GR-TV-AGR-01
    l1_notes:
      ukr: >
        «Для PESEL / по справі» → w sprawie + Gen (*meldunku*), не називний.
        Proszę o… — з o; рід: Przyszłam / Przyszedłem.
      rus: >
        «По делу» → w sprawie + Gen, не *w sprawa / *dla meldunku. Род
        прошедшего — по говорящему; документы — Oto…; просьба — o formularz.
      bel: >
        «Па справе» без Gen → *w sprawa. Трымайце w sprawie… + Gen, Oto…
        і Proszę o…; без ty да служачага.
l1_notes:
  ukr: >
    Пастка: «для PESEL / дай бланк / по справі». Тримайте w sprawie…,
    Oto…, Proszę o formularz; до служачого — pan/pani.
  rus: >
    Пастка: «по делу / для PESEL / дай бланк». Целиком: w sprawie + Gen,
    Oto…, Proszę o formularz — без ty к служащему.
  bel: >
    Пастка: «па справе / для PESEL» і аканне ў лініях. w sprawie… / Oto… /
    Proszę o formularz — асобныя польскія рамкі; без ty да urzędnika.
