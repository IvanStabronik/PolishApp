kind: lesson
canonical_id: LES-A1-UR-01
slug: okienko-i-dokumenty
version: 7
status: DRAFT
title_pl: Okienko i dokumenty
sort_order: 1
situation_ru: >
  Вы впервые подошли к окошку urzędu в Польше. Нужно поздороваться, сказать,
  зачем пришли (sprawa), передать документы и при необходимости попросить
  formularz. Служащий — взрослый незнакомец; речь спокойная, на pan/pani.
objective_ru: >
  Открыть контакт, сказать Przyszedłem/Przyszłam w sprawie…, передать
  dokumenty, попросить formularz при необходимости и спокойно попрощаться —
  на pan/pani, не на ty.
