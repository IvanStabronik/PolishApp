  scenarios:
    - SCN-A1-URZAD-01
  functions:
    - FN-A1-PURPOSE-01
    - FN-A1-DOCS-01
    - FN-A1-ADDRESS-01
    - FN-A1-GREET-01
    - FN-A1-REG-01
