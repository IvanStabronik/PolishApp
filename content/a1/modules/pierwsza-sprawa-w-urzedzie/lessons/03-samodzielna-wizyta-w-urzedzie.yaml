kind: lesson
canonical_id: LES-A1-UR-03
slug: samodzielna-wizyta-w-urzedzie
version: 2
status: DRAFT
title_pl: Samodzielna wizyta w urzędzie
sort_order: 3
situation_ru: >
  Вы сами проходите короткий визит к окошку: поздороваться, сказать зачем
  пришли, назвать себя, передать комплект документов и уточнить, где ждать.
  Служащий — взрослый незнакомец; речь спокойная, на pan/pani.
objective_ru: >
  Пройти контакт от приветствия до прощания: цель (w sprawie…), имя
  (Nazywam się…), документы (Oto…) и уточнение (Gdzie mam czekać?) — на
  pan/pani, не на ty.
curriculum_links:
  scenarios:
    - SCN-A1-URZAD-01
  functions:
    - FN-A1-PURPOSE-01
    - FN-A1-DOCS-01
    - FN-A1-ADDRESS-01
    - FN-A1-GREET-01
    - FN-A1-REG-01
    - FN-A1-IDENTIFY-01
  lex_bundles:
    - LEX-A1-URZAD
    - LEX-A1-DOCS
  concepts:
    - PRAG-PAN-01
    - GR-TV-AGR-01
    - GR-CAS-ACC-01
    - GR-TNS-PRS-01
dialogue:
  title_pl: Samodzielna wizyta w urzędzie
  turns:
    - speaker: Urzędnik
      text_pl: Dzień dobry. W czym mogę pomóc?
    - speaker: Svitlana
      text_pl: Dzień dobry. Przyszłam w sprawie meldunku.
    - speaker: Urzędnik
      text_pl: Jak się pani nazywa?
    - speaker: Svitlana
      text_pl: Nazywam się Svitlana Koval. Oto paszport, wniosek i zdjęcie.
    - speaker: Urzędnik
      text_pl: Dziękuję. Dokumenty są kompletne. Proszę czekać na numer.
    - speaker: Svitlana
      text_pl: Dobrze. Gdzie mam czekać?
    - speaker: Urzędnik
      text_pl: Przy okienku numer cztery.
    - speaker: Svitlana
      text_pl: Rozumiem. Dziękuję. Do widzenia.
key_lines:
  - text_pl: Przyszłam w sprawie meldunku.
    explanation_ru: >
      Цель визита сразу после приветствия: Przyszedłem/Przyszłam w sprawie +
      Gen. Служащий сразу понимает, зачем вы у окошка.
  - text_pl: Nazywam się…
    explanation_ru: >
      Ответ на вопрос служащего, как вас зовут. Целая формула — Nazywam się…
  - text_pl: Oto paszport, wniosek i zdjęcie.
    explanation_ru: >
      Передача полного комплекта: Oto + то, что кладёте на стол. Без догадок.
  - text_pl: Gdzie mam czekać?
    explanation_ru: >
      Спокойное уточнение следующего шага, когда сказали Proszę czekać….
pan_pani:
  summary_ru: >
    К служащему-незнакомцу — pan/pani и 3-е лицо. Цель, имя, документы и
    уточнение — спокойно; ty и приказы вроде *Daj… у окошка не к месту.
  form: "w sprawie · nazywam się · oto dokumenty · proszę czekać"
  examples_pl: &a1
    - Przyszłam w sprawie meldunku.
    - Nazywam się Svitlana Koval.
    - Gdzie mam czekać?
  counterexamples_pl:
    - "*Ty mi powiedz." # грубо к служащему
    - "*Daj mi to." # приказ вместо просьбы
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      Не калькуйте «ти» / «дай» як *Ty… / *Daj… до urzędnika. Тримайте
      w sprawie… · Nazywam się… · Oto… · Gdzie mam…? як цілі рамки.
    rus: >
      Не *Ty… / *Daj… к служащему. Отработайте цепочку w sprawie… →
      Nazywam się… → Oto… → Gdzie mam czekać? целиком.
    bel: >
      Не пераносьце «ты» / «дай» як *Ty… / *Daj…. Трымайце польскія рамкі
      w sprawie… · Nazywam się… · Oto… без калькі з беларускай.
grammar_points:
  - id: GP-A1-UR-L3
    title_pl: Pełny przebieg wizyty
    summary_ru: >
      Собрать знакомые реплики в один визит: приветствие и цель → имя →
      документы → уточнение, где ждать — на pan/pani.
    form: >
      Przyszedłem/Przyszłam w sprawie… Nazywam się… Oto… Gdzie mam…?
    meaning: >
      Пройти короткий официальный контакт от начала до спокойного закрытия.
    use: >
      Самостоятельный визит к одному okienku: цель, имя, комплект и ожидание.
    examples_pl: *a1
    counterexamples_pl:
      - "*Ty daj." # приказ
      - "*Ja nie rozumieć." # ломает глагол
    concept_ids:
      - PRAG-PAN-01
      - GR-TV-AGR-01
      - GR-CAS-ACC-01
    l1_notes:
      ukr: >
        Відпрацьовуйте ланцюжок Przyszłam w sprawie… → Nazywam się… → Oto…
        → Gdzie mam…? цілісно; не складайте з українських слів дослівно.
      rus: >
        Цепочку Przyszłam w sprawie… → Nazywam się… → Oto… → Gdzie mam…?
        берите целиком, без дословной кальки с русского.
      bel: >
        Трымайце ланцужок Przyszłam w sprawie… → Nazywam się… → Oto… →
        Gdzie mam…? цалкам; без даслоўнай калькі з беларускай.
l1_notes:
  ukr: >
    Урок про самостійний візит: w sprawie…, Nazywam się…, Oto dokumenty,
    Gdzie mam czekać? Без ty / *Daj… до служачого.
  rus: >
    Полный короткий визит у окошка: цель → имя → комплект → где ждать.
    Держите pan/pani; без ty к служащему.
  bel: >
    Асобны акцэнт BEL: не капіюйце рускія нотаткі. Польскія рамкі візіту
    цалкам; без «ты» да urzędnika.
