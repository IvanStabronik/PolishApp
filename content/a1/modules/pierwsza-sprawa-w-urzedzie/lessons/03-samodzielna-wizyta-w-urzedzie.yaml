kind: lesson
canonical_id: LES-A1-UR-03
slug: samodzielna-wizyta-w-urzedzie
version: 6
status: DRAFT
title_pl: Samodzielna wizyta w urzędzie
sort_order: 3
situation_ru: >
  Вы сами проходите короткий визит к окошку: поздороваться, сказать зачем
  пришли, назвать себя, передать комплект документов и уточнить, где ждать.
  Служащий — взрослый незнакомец; речь спокойная, на pan/pani.
objective_ru: >
  Пройти контакт от приветствия до прощания: цель (w sprawie…), имя
  (Nazywam się…), документы (Oto…) и уточнение (Gdzie mam czekać?) — на
  pan/pani, не на ty.
curriculum_links:
  scenarios:
    - SCN-A1-URZAD-01
  functions:
    - FN-A1-PURPOSE-01
    - FN-A1-DOCS-01
    - FN-A1-ADDRESS-01
    - FN-A1-GREET-01
    - FN-A1-REG-01
    - FN-A1-IDENTIFY-01
  lex_bundles:
