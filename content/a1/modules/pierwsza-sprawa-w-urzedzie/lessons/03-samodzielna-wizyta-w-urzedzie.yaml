    - GR-TV-AGR-01
    - GR-CAS-ACC-01
    - GR-TNS-PRS-01
dialogue:
  title_pl: Samodzielna wizyta w urzędzie
  turns:
    - speaker: Urzędnik
      text_pl: Dzień dobry. W czym mogę pomóc?
    - speaker: Svitlana
      text_pl: Dzień dobry. Przyszłam w sprawie meldunku.
    - speaker: Urzędnik
      text_pl: Jak się pani nazywa?
    - speaker: Svitlana
      text_pl: Nazywam się Svitlana Koval. Oto paszport, wniosek i zdjęcie.
    - speaker: Urzędnik
      text_pl: Dziękuję. Dokumenty są kompletne. Proszę czekać na numer.
    - speaker: Svitlana
      text_pl: Dobrze. Gdzie mam czekać?
    - speaker: Urzędnik
      text_pl: Przy okienku numer cztery.
    - speaker: Svitlana
      text_pl: Rozumiem. Dziękuję. Do widzenia.
key_lines:
  - text_pl: Przyszłam w sprawie meldunku.
    explanation_ru: >
      Цель визита сразу после приветствия: Przyszedłem/Przyszłam w sprawie +
      Gen. Служащий сразу понимает, зачем вы у окошка.
  - text_pl: Nazywam się…
    explanation_ru: >
      Ответ на вопрос служащего, как вас зовут. Целая формула — Nazywam się…
  - text_pl: Oto paszport, wniosek i zdjęcie.
    explanation_ru: >
      Передача полного комплекта: Oto + то, что кладёте на стол. Без догадок.
  - text_pl: Gdzie mam czekać?
    explanation_ru: >
      Спокойное уточнение следующего шага, когда сказали Proszę czekać….
pan_pani:
  summary_ru: >
    К служащему-незнакомцу — pan/pani и 3-е лицо. Цель, имя, документы и
    уточнение — спокойно; ty и приказы вроде *Daj… у окошка не к месту.
  form: "w sprawie · nazywam się · oto dokumenty · proszę czekać"
  examples_pl: &a1
    - Przyszłam w sprawie meldunku.
    - Nazywam się Svitlana Koval.
    - Gdzie mam czekać?
  counterexamples_pl:
    - "*Ty mi powiedz." # грубо к служащему
    - "*Daj mi to." # приказ вместо просьбы
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      «Ти / дай / як мене звуть» → не *Ty… / *Daj…; ім'я — Nazywam się…
      цілком. Ланцюжок: w sprawie… · Nazywam się… · Oto… · Gdzie mam…?
    rus: >
      Не *Ty… / *Daj… к служащему. Имя — Nazywam się…, не *Nazywam…
      без się. Цепочка целиком.
    bel: >
      «Ты / дай / як мяне клічуць» → Nazywam się… цалкам; w sprawie… ·
      Oto… — асобныя польскія рамкі; без ty да служачага.
grammar_points:
  - id: GP-A1-UR-L3
    title_pl: Pełny przebieg wizyty
    summary_ru: >
      Собрать знакомые реплики в один визит: приветствие и цель → имя →
      документы → уточнение, где ждать — на pan/pani.
    form: >
      Przyszedłem/Przyszłam w sprawie… Nazywam się… Oto… Gdzie mam…?
    meaning: >
      Пройти короткий официальный контакт от начала до спокойного закрытия.
    use: >
      Самостоятельный визит к одному okienku: цель, имя, комплект и ожидание.
    examples_pl: *a1
    counterexamples_pl:
      - "*Nazywam Svitlana." # без się
      - "*Przyszłam w sprawa." # без Gen
    concept_ids:
      - PRAG-PAN-01
      - GR-TV-AGR-01
      - GR-CAS-ACC-01
    l1_notes:
      ukr: >
        Не *Nazywam без się. Ланцюжок польськими формулами:
        w sprawie… → Nazywam się… → Oto… → Gdzie mam…?
      rus: >
        Цепочку Przyszłam w sprawie… → Nazywam się… → Oto… → Gdzie mam…?
        берите целиком; się обязательно.
      bel: >
        «Па справе / як мяне клічуць» → w sprawie… / Nazywam się…. Ланцужок
        цалкам; się абавязковае.
l1_notes:
  ukr: >
    Пастка: «ти / дай / як мене звуть без się». Тримайте w sprawie…,
    Nazywam się…, Oto…, Gdzie mam czekać?
  rus: >
    Пастка: ty / приказ / *Nazywam без się. Цель → имя → комплект → где
    ждать — целиком, на pan/pani.
  bel: >
    Пастка: «ты / дай» і *Nazywam без się. w sprawie… / Nazywam się… /
    Oto… / Gdzie mam…? — асобныя польскія рамкі.
