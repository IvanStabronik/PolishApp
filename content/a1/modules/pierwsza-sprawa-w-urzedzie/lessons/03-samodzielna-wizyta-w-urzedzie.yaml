dialogue:
  title_pl: Samodzielna wizyta w urzędzie
  turns:
    - speaker: Urzędnik
      text_pl: Dzień dobry. W czym mogę pomóc?
    - speaker: Svitlana
      text_pl: Dzień dobry. Przyszłam w sprawie meldunku.
    - speaker: Urzędnik
      text_pl: Jak się pani nazywa?
    - speaker: Svitlana
      text_pl: Nazywam się Svitlana Koval. Oto paszport, wniosek i zdjęcie.
    - speaker: Urzędnik
      text_pl: Dziękuję. Dokumenty są kompletne. Proszę czekać na numer.
    - speaker: Svitlana
      text_pl: Dobrze. Gdzie mam czekać?
    - speaker: Urzędnik
      text_pl: Przy okienku numer cztery.
    - speaker: Svitlana
      text_pl: Rozumiem. Dziękuję. Do widzenia.
key_lines:
  - text_pl: Przyszłam w sprawie meldunku.
    explanation_ru: Цель визита называется сразу после приветствия.
  - text_pl: Nazywam się…
    explanation_ru: Идентификация по вопросу служащего.
  - text_pl: Oto paszport, wniosek i zdjęcie.
    explanation_ru: Передача полного перечисленного комплекта.
  - text_pl: Gdzie mam czekać?
    explanation_ru: Уточнение следующего действия.
pan_pani:
  summary_ru: С незнакомым взрослым собеседником сохраняйте pan/pani и третье лицо; нейтральные
    просьбы и благодарность важнее буквального переноса форм L1.
  form: w sprawie · nazywam się · oto dokumenty · proszę czekać
  examples_pl: &a1
    - Przyszłam w sprawie meldunku.
    - Nazywam się Svitlana Koval.
    - Gdzie mam czekać?
  counterexamples_pl:
    - "*Ty mi powiedz."
    - "*Daj mi to."
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: Відпрацьовуйте польську рамку «w sprawie · nazywam się · oto dokumenty · proszę czekać»
      цілісно; не складайте її дослівно з українських слів.
    rus: Отрабатывайте польскую рамку «w sprawie · nazywam się · oto dokumenty · proszę czekać» целиком,
      без дословной кальки с русского.
    bel: Адпрацоўвайце польскую рамку «w sprawie · nazywam się · oto dokumenty · proszę czekać» цалкам;
      не складайце яе даслоўна з беларускай.
