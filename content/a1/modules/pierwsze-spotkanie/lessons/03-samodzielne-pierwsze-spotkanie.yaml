title_pl: Samodzielne pierwsze spotkanie
sort_order: 3
situation_ru: >
  Новый сосед. Вы сами начинаете короткое знакомство и сами его закрываете —
  без подсказки, на pan/pani.
objective_ru: >
  Сами провести знакомство: Dzień dobry, имя, откуда вы, встречный вопрос
  и Do widzenia.
