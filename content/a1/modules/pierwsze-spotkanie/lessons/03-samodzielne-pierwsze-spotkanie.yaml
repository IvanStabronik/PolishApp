kind: lesson
canonical_id: LES-A1-PS-03
slug: samodzielne-pierwsze-spotkanie
version: 7
status: DRAFT
title_pl: Samodzielne pierwsze spotkanie
sort_order: 3
situation_ru: >
  Новый сосед. Вы сами начинаете короткое знакомство и сами его закрываете —
  без подсказки, на pan/pani. Как во взрослой жизни, не как учебный диалог
  «для детей».
objective_ru: >
  Сами провести знакомство: Dzień dobry, имя, откуда вы, встречный вопрос
  и Do widzenia — целой рамкой.
curriculum_links:
  scenarios:
    - SCN-A1-EVERYDAY-01
  functions:
    - FN-A1-IDENTIFY-01
    - FN-A1-GREET-01
  lex_bundles:
    - LEX-A1-IDENTITY
    - LEX-A1-GREETINGS
  concepts:
    - GR-CAS-NOM-01
    - GR-TNS-PRS-01
    - PRAG-PAN-01
    - PHON-CORE-01
dialogue:
  title_pl: Samodzielne pierwsze spotkanie
  turns:
    - speaker: Nina
      text_pl: Dzień dobry. Jestem Nina Kowal. Nazywam się Nina.
    - speaker: Paweł
      text_pl: Dzień dobry. Paweł Lis. Miło panią poznać.
    - speaker: Nina
      text_pl: Wzajemnie. Jestem z Białorusi. A pan?
    - speaker: Paweł
      text_pl: Jestem z Polski, z Gdańska.
    - speaker: Nina
      text_pl: Dziękuję za rozmowę. Do widzenia.
    - speaker: Paweł
      text_pl: Do widzenia.
key_lines:
  - text_pl: Dzień dobry. Nazywam się…
    explanation_ru: >
      Сами открываете разговор: приветствие и имя одной связкой.
  - text_pl: Jestem z… A pan?
    explanation_ru: >
      Откуда вы — и короткий встречный вопрос (A pan? / A pani?).
  - text_pl: Miło pana / panią poznać.
    explanation_ru: >
      Вежливое «приятно познакомиться»: pana к мужчине, panią к женщине.
  - text_pl: Dziękuję za rozmowę.
    explanation_ru: >
      Спокойно закрыть короткое знакомство перед Do widzenia.
pan_pani:
  summary_ru: >
    С незнакомым взрослым — pan/pani и 3 лицо. Не переходите на ty,
    пока человек сам не предложит.
  form: Dzień dobry · Nazywam się… · A pan/pani? · Do widzenia
  examples_pl: &a1
    - Nazywam się Nina Kowal.
    - Jestem z Białorusi. A pan?
    - Miło pana poznać.
  counterexamples_pl:
    - "*Ty mi powiedz."
    - "*Daj mi to."
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      Не збирайте знайомство з «мене звати / я з…» дослівно. Тримайте
      Dzień dobry → Nazywam się… → A pan/pani? → Do widzenia; з
      незнайомцем — не ty.
    rus: >
      Держите рамку «Dzień dobry · Nazywam się… · A pan/pani? · Do widzenia»
      целиком; не собирайте её дословно с русского и не переходите на ty
      с незнакомцем.
    bel: >
      Не збірайце знаёмства з «мяне клічуць / я з…» даслоўна. Трымайце
      Dzień dobry → Nazywam się… → A pan/pani? → Do widzenia; з
      незнаёмцам — не ty.
grammar_points:
  - id: GP-A1-PS-L3
    title_pl: Spójna autoprezentacja
    summary_ru: >
      Связать знакомые реплики в одно короткое знакомство — от приветствия
      до прощания.
    form: Dzień dobry. Nazywam się + imię. Jestem z + miejsce. A pan/pani?
    meaning: >
      Собеседник понимает, кто вы, откуда вы, и разговор можно спокойно закрыть.
    use: >
      Новый сосед: сами начать, обменяться и попрощаться на pan/pani.
    examples_pl: *a1
    counterexamples_pl:
      - "*Ty daj."
      - "*Ja nie rozumieć."
    concept_ids:
      - GR-CAS-NOM-01
      - GR-TNS-PRS-01
      - PRAG-PAN-01
    l1_notes:
      ukr: >
        Калька «мене звати / я з…» ламає рамку. Тримайте Nazywam się…
        і Jestem z… цілими, потім A pan/pani?
      rus: >
        Рамка Dzień dobry → Nazywam się… → Jestem z… → A pan/pani? — целое
        действие. Не собирайте её с русского «меня зовут / я из…» дословно.
      bel: >
        «Мяне клічуць / я з…» даслоўна не працуе. Nazywam się… / Jestem z…
        вучыце цэлымі, потым A pan/pani? — як у дыялогу.
l1_notes:
  ukr: >
    Самі проведіть знайомство цілими формулами. З незнайомцем — pan/pani,
    не ty; A pan? / A pani? повертає питання без «ти».
  rus: >
    Сами проведите знакомство целыми формулами. С незнакомцем — pan/pani,
    не ty; A pan? / A pani? возвращает вопрос без «ты».
  bel: >
    Самі правядзіце знаёмства цэлымі формуламі. З незнаёмцам — pan/pani,
    не ty; A pan? / A pani? вяртае пытанне без «ты».
