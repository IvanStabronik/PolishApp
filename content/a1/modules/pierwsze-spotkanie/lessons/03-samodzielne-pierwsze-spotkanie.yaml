dialogue:
  title_pl: Samodzielne pierwsze spotkanie
  turns:
    - speaker: Nina
      text_pl: Dzień dobry. Jestem Nina Kowal. Nazywam się Nina.
    - speaker: Paweł
      text_pl: Dzień dobry. Paweł Lis. Miło panią poznać.
    - speaker: Nina
      text_pl: Wzajemnie. Jestem z Białorusi. A pan?
    - speaker: Paweł
      text_pl: Jestem z Polski, z Gdańska.
    - speaker: Nina
      text_pl: Dziękuję za rozmowę. Do widzenia.
    - speaker: Paweł
      text_pl: Do widzenia.
key_lines:
  - text_pl: Dzień dobry. Nazywam się…
    explanation_ru: Самостоятельное открытие и представление одной связкой.
  - text_pl: Jestem z… A pan?
    explanation_ru: Происхождение плюс вежливый встречный вопрос.
  - text_pl: Miło pana / panią poznać.
    explanation_ru: Форма зависит от адресата.
  - text_pl: Dziękuję za rozmowę.
    explanation_ru: Нейтральное завершение короткого знакомства.
pan_pani:
  summary_ru: С незнакомым взрослым собеседником сохраняйте pan/pani и третье лицо; нейтральные
    просьбы и благодарность важнее буквального переноса форм L1.
  form: Dzień dobry · Nazywam się… · A pan/pani? · Do widzenia
  examples_pl: &a1
    - Nazywam się Nina Kowal.
    - Jestem z Białorusi. A pan?
    - Miło pana poznać.
  counterexamples_pl:
    - "*Ty mi powiedz."
    - "*Daj mi to."
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: Відпрацьовуйте польську рамку «Dzień dobry · Nazywam się… · A pan/pani? · Do widzenia» цілісно;
      не складайте її дослівно з українських слів.
    rus: Отрабатывайте польскую рамку «Dzień dobry · Nazywam się… · A pan/pani? · Do widzenia» целиком,
      без дословной кальки с русского.
    bel: Адпрацоўвайце польскую рамку «Dzień dobry · Nazywam się… · A pan/pani? · Do widzenia» цалкам;
      не складайце яе даслоўна з беларускай.
