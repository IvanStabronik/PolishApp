status: DRAFT
title_pl: Powitanie i przedstawienie
sort_order: 1
situation_ru: >
  Первый разговор со взрослым в Польше — сосед на кlatce или кто-то с работы.
  Нужны имя и откуда вы — без панибратства и без детских «привет».
objective_ru: >
  Поздороваться (Dzień dobry), сказать Nazywam się… и Jestem z…,
  держаться pan/pani (3 лицо), не ty и не wy jesteście.
