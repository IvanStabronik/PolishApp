dialogue:
  title_pl: Spotkanie na klatce
  turns:
    - speaker: Marek
      text_pl: Dzień dobry.
    - speaker: Olena
      text_pl: Dzień dobry.
    - speaker: Marek
      text_pl: Nazywam się Marek Nowak. A pani?
    - speaker: Olena
      text_pl: Nazywam się Olena Kovalenko. Jestem z Ukrainy.
    - speaker: Marek
      text_pl: Miło mi. Ja jestem z Polski. Skąd pani jest?
    - speaker: Olena
      text_pl: Jestem z Lwowa, a teraz mieszkam w Warszawie.
    - speaker: Marek
      text_pl: Miło panią poznać.
    - speaker: Olena
      text_pl: Wzajemnie. Do widzenia.
    - speaker: Marek
      text_pl: Do widzenia.
key_lines:
  - text_pl: Dzień dobry.
    explanation_ru: >
      Обычное «здравствуйте» днём. К взрослому незнакомцу — да; cześć —
      только если уже на «ты» или в совсем своей компании.
  - text_pl: Nazywam się Marek Nowak.
    explanation_ru: >
      Так говорят «меня зовут»: Nazywam się + имя. Без się фраза ломается
      (*Nazywam Marek — так не говорят).
  - text_pl: Jestem z Ukrainy. / Jestem z Lwowa.
    explanation_ru: >
      «Я из…»: Jestem z + род. падеж (z Ukrainy, z Lwowa). Учите целиком
      на частых местах.
  - text_pl: Miło panią poznać. / Do widzenia.
    explanation_ru: >
      Вежливо закрыть разговор: Miło panią/pana poznać и Do widzenia.
pan_pani:
  summary_ru: >
    К взрослому незнакомцу — pan / pani и глагол в 3 лице (Skąd pani jest?).
    На ty переходите только если человек сам предложил или вы уже свои.
  form: "Czy może mi pan / pani…? · Skąd pan / pani jest? · Miło pana / panią poznać."
  examples_pl:
    - Skąd pani jest?
    - Miło panią poznać.
    - Nazywam się Olena. A pan?
  counterexamples_pl:
    - "*Skąd ty jesteś?" # к незнакомцу на кlatce
    - "*Wy jesteście z Ukrainy?" # калька «вы» + 2 л. мн.
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      Українське «ви» не копіюється як wy + 2 ос. мн. до незнайомої людини.
      На перший контакт — pan/pani + 3 особа; «ти» лише після явного дозволу.
    rus: >
      Русское «вы» + глагол во 2 л. мн. (*Вы откуда?*) — типичная ошибка.
      По-польски к незнакомке: Skąd pani jest? (3 л.), не *Skąd wy jesteście?
      Вокатив в обращении слабее привычки — не подставляйте именительный вместо
      устойчивых формул pani / pan.
    bel: >
      Беларускае «вы» і хуткі пераход на «ты» сярод «сваіх» не адмяняюць
      польскі pan/pani з незнаёмцам. Трымайцеся рэплік дыялогу.
grammar_points:
  - id: GP-A1-PS-NAZYWAM-JESTEM
    title_pl: Nazywam się… / Jestem z…
    summary_ru: >
      Две короткие фразы: как вас зовут и откуда вы.
    form: >
      Nazywam się + имя (именительный). Jestem z + место (родительный):
      z Ukrainy, z Lwowa, z Polski.
    meaning: >
      Собеседник понимает, кто вы и откуда.
    use: >
      Сосед, короткий разговор на работе. Потом можно добавить:
      teraz mieszkam w…
    examples_pl:
      - Nazywam się Olena Kovalenko.
      - Jestem z Ukrainy.
      - Jestem z Lwowa.
    counterexamples_pl:
      - "*Nazywam Olena." # без się
      - "*Jestem z Ukraina." # без Dopełniacz
      - "*Ja z Ukrainy nazywam." # сломанный порядок слотов
    concept_ids:
      - GR-CAS-NOM-01
      - GR-TNS-PRS-01
    l1_notes:
      ukr: >
        Калька «Мене звати / У мене на ім'я» → *Nazywam Olena* без się.
        Тримайте цілу рамку Nazywam się…. Для походження: Jestem z +
        dopełniacz (z Ukrainy), не називний *z Ukraina.
      rus: >
        «Меня зовут» часто даёт *Mienia zowut / Nazywam Anna* без się.
        Зафиксируйте się как часть формулы. «Я из…» → Jestem z + род.п.,
        не *Ja z Ukraina без падежа.
      bel: >
        Аканне ў імёнах і тапонімах на пісьме не пераносіце ў польскую
        артаграфію. Nazywam się… / Jestem z… вучыце цэлымі — не збірайце
        з бел. «Мяне клічуць» даслоўна.
l1_notes:
  ukr: >
    Не калькуйте «мене звати» / «я з…» дослівно. Тримайте Nazywam się…
    і Jestem z…. Імена читайте по-польськи, не «як кирилицею».
  rus: >
    Не переводите «меня зовут» без się и не говорите незнакомцу
    «вы» как wy jesteście. Ударение в именах — по-польски (обычно на
    предпоследний слог).
  bel: >
    Не спадзявайцеся на «і так зразумеюць». Pan/pani + Nazywam się /
    Jestem z — асобныя польскія формулы; пішыце імёны без акання.
