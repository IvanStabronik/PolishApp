version: 1
status: DRAFT
title_pl: Powitanie i przedstawienie
sort_order: 1
situation_ru: >
  Вы впервые здороваетесь со взрослым человеком в Польше (сосед, знакомый
  на работе). Речь спокойная, темы знакомые: имя и происхождение.
objective_ru: >
  Поздороваться формулой дня, представиться польскими конструкциями
  «Nazywam się…» и «Jestem z…», выбрать pan/pani вместо преждевременного ty.
