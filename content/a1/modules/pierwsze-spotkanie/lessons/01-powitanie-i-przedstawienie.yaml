dialogue:
  title_pl: Spotkanie na klatce
  turns:
    - speaker: Marek
      text_pl: Dzień dobry.
    - speaker: Olena
      text_pl: Dzień dobry.
    - speaker: Marek
      text_pl: Nazywam się Marek Nowak. A pani?
    - speaker: Olena
      text_pl: Nazywam się Olena Kovalenko. Jestem z Ukrainy.
    - speaker: Marek
      text_pl: Miło mi. Ja jestem z Polski. Skąd pani jest?
    - speaker: Olena
      text_pl: Jestem z Lwowa, a teraz mieszkam w Warszawie.
    - speaker: Marek
      text_pl: Miło panią poznać.
    - speaker: Olena
      text_pl: Wzajemnie. Do widzenia.
    - speaker: Marek
      text_pl: Do widzenia.
key_lines:
  - text_pl: Dzień dobry.
    explanation_ru: >
      Нейтральное / вежливое приветствие днём. Подходит для первого контакта
      со взрослым незнакомцем; не смешивать с cześć в urzędzie или с соседом,
      которого вы ещё не знаете.
  - text_pl: Nazywam się Marek Nowak.
    explanation_ru: >
      Формула самопредставления: nazywam się + имя (именительный). Это не
      дословный перевод «меня зовут» без się.
  - text_pl: Jestem z Ukrainy. / Jestem z Lwowa.
    explanation_ru: >
      Jestem z + родительный падеж места происхождения. На A1 учим формулу
      целиком на частых топонимах.
  - text_pl: Miło panią poznać. / Do widzenia.
    explanation_ru: >
      Закрытие первого контакта в вежливом регистре: panią / pana согласуется
      с адресатом; do widzenia — стандартное прощание.
pan_pani:
  summary_ru: >
    С незнакомцем-взрослым в Польше по умолчанию используйте pan (к мужчине)
    или pani (к женщине) и глагол в 3-м лице. Форма ty — только после явного
    сигнала собеседника или в явно неформальном кругу.
  form: "Czy może mi pan / pani…? · Skąd pan / pani jest? · Miło pana / panią poznać."
  examples_pl:
    - Skąd pani jest?
    - Miło panią poznać.
    - Nazywam się Olena. A pan?
  counterexamples_pl:
    - "*Skąd ty jesteś?" # к незнакомцу на кlatce
    - "*Wy jesteście z Ukrainy?" # калька «вы» + 2 л. мн.
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      Українське «ви» не копіюється в польську як wy + 2 ос. мн. до незнайомої
      людини. Для першого контакту тримайте pan/pani + 3 особа; «ти» лише після
      явного дозволу. Не переносьте вокатив імен на польський pani без моделі
      з діалогу.
    rus: >
      Русское «вы» + глагол во 2 л. мн. (*Вы откуда?*) — типичная ошибка.
      По-польски к незнакомке: Skąd pani jest? (3 л.), не *Skąd wy jesteście?
      Вокатив в обращении слабее привычки — не подставляйте именительный вместо
      устойчивых формул pani / pan.
    bel: >
      Беларускае «вы» і звычка пераходзіць на «ты» сярод «сваіх» не адмяняюць
      польскі pan/pani з незнаёмцам. Не калькуйце «добры дзень» парадкам слоў
      і не змешвайце bel. ветлівасць з польскай 3-й асобай; трымайцеся рэплік
      дыялогу.
grammar_points:
  - id: GP-A1-PS-NAZYWAM-JESTEM
    title_pl: Nazywam się… / Jestem z…
    summary_ru: >
      Две опорные формулы идентичности на A1: назвать себя и сказать
      происхождение.
    form: >
      Nazywam się + Imię (Mianownik). Jestem z + miejsce (Dopełniacz):
      z Ukrainy, z Lwowa, z Polski.
    meaning: >
      Сообщить, кто говорит, и откуда — чтобы собеседник однозначно вас опознал.
    use: >
      Первый контакт, сосед, короткий обмен на работе; затем можно добавить
      «teraz mieszkam w…».
    examples_pl:
      - Nazywam się Olena Kovalenko.
      - Jestem z Ukrainy.
      - Jestem z Lwowa.
    counterexamples_pl:
      - "*Nazywam Olena." # без się
      - "*Jestem z Ukraina." # без Dopełniacz
      - "*Ja z Ukrainy nazywam." # сломанный порядок слотов
    concept_ids:
      - GR-CAS-NOM-01
      - GR-TNS-PRS-01
    l1_notes:
      ukr: >
        Калька «Мене звати / У мене на ім'я» → *Nazywam Olena* без się або
        *U mnie na imię*. Тримайте цілу рамку Nazywam się…. Для походження
        Jestem z + dopełniacz (z Ukrainy), не називний *z Ukraina.
      rus: >
        «Меня зовут» часто даёт *Mienia zowut / Nazywam Anna* без się.
        Зафиксируйте się как часть формулы. «Я из…» → Jestem z + род.п.,
        не *Ja z Ukraina без падежа.
      bel: >
        Аканне ў імёнах/тапонімах на пісьме не пераносіце ў польскую
        артаграфію. Формулы Nazywam się… / Jestem z… вучыце цэлымі; не
        збірайце іх з бел. «Мяне клічуць» даслоўна.
l1_notes:
  ukr: >
    Урок про перший дорослий контакт: день добрий → представлення → pan/pani.
    Не підставляйте українські рамки «мене звати / я з…» дослівно; тримайте
    польські слоти. Фонетика імен (PHON-CORE-01) — читайте по-польськи, не
    «як кирилицею».
  rus: >
    Фокус: вежливое приветствие и самопредставление без кальки «меня зовут»
    и без «вы» во 2 л. мн. к незнакомцу. Имена и топонимы произносите по
    польской модели ударения (парокситон), не по русскому слуху.
  bel: >
    Асобны акцэнт для BEL: не спадзявайцеся на «і так зразумеюць» і не
    капіюйце рускія нотаткі. Ветлівы pan/pani + Nazywam się / Jestem z —
    асобныя польскія формулы; пісьмо імёнаў без акання і без замены ł на ў.
