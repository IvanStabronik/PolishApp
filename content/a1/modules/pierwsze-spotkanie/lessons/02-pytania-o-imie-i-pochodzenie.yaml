dialogue:
  title_pl: Pytania o imię i pochodzenie
  turns:
    - speaker: Ewa
      text_pl: Dzień dobry. Nazywam się Ewa. Jak ma pan na imię?
    - speaker: Taras
      text_pl: Nazywam się Taras Bondar.
    - speaker: Ewa
      text_pl: Miło mi. Skąd pan jest?
    - speaker: Taras
      text_pl: Jestem z Ukrainy, z Odessy. A pani?
    - speaker: Ewa
      text_pl: Jestem z Polski. Miło pana poznać.
    - speaker: Taras
      text_pl: Wzajemnie.
key_lines:
  - text_pl: Jak ma pan na imię?
    explanation_ru: >
      Как спросить имя у мужчины на «вы»: pan и глагол в 3 лице
      (не *Jak masz…* к незнакомцу).
  - text_pl: Skąd pani jest?
    explanation_ru: >
      «Откуда вы?» к женщине: pani + jest (3 л.), не ty и не wy jesteście.
  - text_pl: A pan? / A pani?
    explanation_ru: >
      Коротко вернуть тот же вопрос: вы ответили — и спросили обратно.
  - text_pl: Wzajemnie.
    explanation_ru: >
      Ответ на Miło mi / Miło pana poznać — «взаимно», без лишних слов.
pan_pani:
  summary_ru: >
    К взрослому незнакомцу — pan / pani и 3 лицо: Jak ma pan na imię?,
    Skąd pani jest? Не переходите на ty, пока человек сам не предложит.
  form: Jak ma pan/pani na imię? · Skąd pan/pani jest? · A pan/pani?
  examples_pl: &a1
    - Jak ma pani na imię?
    - Skąd pan jest?
    - A pani?
  counterexamples_pl:
    - "*Ty mi powiedz."
    - "*Daj mi to."
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      «Як вас звати?» / «Звідки ви?» не дає *Jak masz…* і не wy + 2 ос. мн.
      До незнайомця — Jak ma pan/pani na imię? і Skąd pan/pani jest?;
      назад — A pan? / A pani?
    rus: >
      Не подставляйте «Как вас зовут?» / «Откуда вы?» как *Jak masz…*
      или wy jesteście. Нужны Jak ma pan/pani na imię? и Skąd pan/pani jest?
      целиком; встречный вопрос — A pan? / A pani?
    bel: >
      «Як вас завуць?» / «Адкуль вы?» — не *Jak masz…* і не wy jesteście.
      З незнаёмцам: Jak ma pan/pani na imię? і Skąd pan/pani jest?;
      сустрэчнае — A pan? / A pani?
grammar_points:
  - id: GP-A1-PS-L2
    title_pl: Pytania z pan / pani
    summary_ru: >
      Два вопроса и короткий возврат: имя, откуда, A pan? / A pani?
    form: Jak ma pan/pani na imię? · Skąd pan/pani jest? · A pan/pani?
    meaning: >
      Вы узнаёте, как человека зовут и откуда он, и можете ответить сами.
    use: >
      Сосед, короткий разговор на работе: спросить → ответить → вернуть вопрос.
    examples_pl: *a1
    counterexamples_pl:
      - "*Ty daj."
      - "*Ja nie rozumieć."
    concept_ids:
      - GR-CAS-NOM-01
      - GR-TNS-PRS-01
      - PRAG-PAN-01
    l1_notes:
      ukr: >
        З pan/pani дієслово в 3 особі: ma / jest, не masz / jesteś.
        Українське «ви» ≠ wy. A pani? — окрема коротка формула.
      rus: >
        Рамка с pan/pani + 3 л.: ma / jest, не masz / jesteś. Не копируйте
        русское «вы» как wy. A pani? — отдельная короткая формула.
      bel: >
        З pan/pani — 3 асоба: ma / jest, не masz / jesteś. Беларус. «вы»
        не пераносіцца як wy. A pani? — асобная кароткая формула.
l1_notes:
  ukr: >
    Питайте цілими формулами. З незнайомцем — не ty; A pan? / A pani?
    повертає те саме питання без «ти».
  rus: >
    Спрашивайте и отвечайте целыми формулами. С незнакомцем — не ty;
    A pan? / A pani? возвращает тот же вопрос без «ты».
  bel: >
    Пытанні і адказы — цэлымі формуламі. З незнаёмцам не ty;
    A pan? / A pani? вяртае тое ж пытанне без «ты».
