slug: pytania-o-imie-i-pochodzenie
version: 1
status: DRAFT
title_pl: Pytania o imię i pochodzenie
sort_order: 2
situation_ru: "Вы продолжаете первое знакомство: спрашиваете имя и происхождение, затем отвечаете
  полными короткими репликами."
objective_ru: Закрепить взаимный обмен именем и происхождением с pan/pani и связать ответы в короткий разговор.
curriculum_links:
  scenarios:
    - SCN-A1-EVERYDAY-01
  functions:
    - FN-A1-IDENTIFY-01
    - FN-A1-GREET-01
