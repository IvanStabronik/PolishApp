slug: pytania-o-imie-i-pochodzenie
version: 5
status: DRAFT
title_pl: Pytania o imię i pochodzenie
sort_order: 2
situation_ru: >
  Знакомство уже началось. Теперь вы сами спрашиваете имя и откуда человек —
  и коротко отвечаете, когда спрашивают вас. Как со взрослым на работе или
  у соседа — не как в чате с друзьями.
objective_ru: >
  Спросить Jak ma pan/pani na imię? и Skąd pan/pani jest?, ответить самому
  и вернуть вопрос (A pan? / A pani?) — на pan/pani, без masz / ty.
