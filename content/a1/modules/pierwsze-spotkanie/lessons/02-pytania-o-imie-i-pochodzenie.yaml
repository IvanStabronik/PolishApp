  concepts:
    - GR-CAS-NOM-01
    - GR-TNS-PRS-01
    - PRAG-PAN-01
    - PHON-CORE-01
dialogue:
  title_pl: Pytania o imię i pochodzenie
  turns:
    - speaker: Ewa
      text_pl: Dzień dobry. Nazywam się Ewa. Jak ma pan na imię?
    - speaker: Taras
      text_pl: Nazywam się Taras Bondar.
    - speaker: Ewa
      text_pl: Miło mi. Skąd pan jest?
    - speaker: Taras
      text_pl: Jestem z Ukrainy, z Odessy. A pani?
    - speaker: Ewa
      text_pl: Jestem z Polski. Miło pana poznać.
    - speaker: Taras
      text_pl: Wzajemnie.
key_lines:
  - text_pl: Jak ma pan na imię?
    explanation_ru: "Вежливый вопрос об имени мужчины: pan и глагол в третьем лице."
  - text_pl: Skąd pani jest?
    explanation_ru: Вопрос о происхождении женщины в регистре pani.
  - text_pl: A pan? / A pani?
    explanation_ru: Короткий способ вернуть тот же вопрос собеседнику.
  - text_pl: Wzajemnie.
    explanation_ru: Естественный ответ на Miło mi / Miło pana poznać.
pan_pani:
  summary_ru: С незнакомым взрослым собеседником сохраняйте pan/pani и третье лицо; нейтральные
    просьбы и благодарность важнее буквального переноса форм L1.
  form: Jak ma pan/pani na imię? · Skąd pan/pani jest?
  examples_pl: &a1
    - Jak ma pani na imię?
    - Skąd pan jest?
    - A pani?
  counterexamples_pl:
    - "*Ty mi powiedz."
    - "*Daj mi to."
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: Відпрацьовуйте польську рамку «Jak ma pan/pani na imię? · Skąd pan/pani jest?» цілісно; не
      складайте її дослівно з українських слів.
    rus: Отрабатывайте польскую рамку «Jak ma pan/pani na imię? · Skąd pan/pani jest?» целиком, без
      дословной кальки с русского.
    bel: Адпрацоўвайце польскую рамку «Jak ma pan/pani na imię? · Skąd pan/pani jest?» цалкам; не
      складайце яе даслоўна з беларускай.
