version: 1
status: DRAFT
title_pl: Zamówienie przy barze
sort_order: 1
situation_ru: >
  Вы стоите у стойки в небольшой кофейне в Польше. Нужно заказать кофе
  или чай, уточнить размер или наличие и оплатить заказ. Бариста — взрослый
  незнакомец; темы знакомые, речь спокойная.
objective_ru: >
  Поздороваться, заказать позицию (Poproszę…), спросить о наличии, подтвердить
  оплату и поблагодарить — удерживая pan/pani вместо ty.
