kind: lesson
canonical_id: LES-A1-WK-01
slug: zamowienie-przy-barze
version: 8
status: DRAFT
title_pl: Zamówienie przy barze
sort_order: 1
situation_ru: >
  Утро или день, небольшая кофейня в Польше. Вы у стойки: кофе или чай,
  размер, есть ли ещё в меню, потом оплата. Бариста — взрослый незнакомец;
  без панибратства и без резкого «дайте».
objective_ru: >
  Поздороваться, заказать Poproszę… (+ Acc), спросить Czy jest…?,
  спросить Ile płacę? и оплатить kartą — на pan/pani, не на ty.
curriculum_links:
  scenarios:
    - SCN-A1-FOOD-01
  functions:
    - FN-A1-TRANS-01
    - FN-A1-ASK-01
    - FN-A1-ADDRESS-01
    - FN-A1-QUANT-01
    - FN-A1-THANKS-01
  lex_bundles:
    - LEX-A1-SERVICE
    - LEX-A1-MONEY
  concepts:
    - GR-CAS-ACC-01
    - GR-PRO-DEM-01
    - GR-NUM-MONEY-01
    - PRAG-PAN-01
dialogue:
  title_pl: Kawa przy barze
  turns:
    - speaker: Barista
      text_pl: Dzień dobry. W czym mogę pomóc?
    - speaker: Iryna
      text_pl: Dzień dobry. Poproszę kawę latte.
    - speaker: Barista
      text_pl: Dużą czy małą?
    - speaker: Iryna
      text_pl: Dużą, proszę. Czy jest też herbata?
    - speaker: Barista
      text_pl: Tak, jest. Coś jeszcze?
    - speaker: Iryna
      text_pl: Nie, to wszystko. Ile płacę?
    - speaker: Barista
      text_pl: Osiemnaście złotych. Kartą czy gotówką?
    - speaker: Iryna
      text_pl: Kartą, proszę. Dziękuję.
    - speaker: Barista
      text_pl: Proszę bardzo. Miłego dnia!
    - speaker: Iryna
      text_pl: Wzajemnie. Do widzenia.
key_lines:
  - text_pl: Poproszę kawę latte.
    explanation_ru: >
      Обычный заказ: Poproszę + винительный (Biernik). Не переводите
      «дайте мне» как резкое *Daj mi… к незнакомцу за стойкой.
  - text_pl: Dużą czy małą?
    explanation_ru: >
      Вопрос про размер. В ответе часто повторяют прилагательное:
      Dużą, proszę — в согласовании с подразумеваемым напитком.
  - text_pl: Czy jest też herbata?
    explanation_ru: >
      «Есть ли ещё…?»: Czy jest…? — спокойный шаблон для меню и стойки.
  - text_pl: Ile płacę? / Kartą, proszę.
    explanation_ru: >
      Цена и способ оплаты: Ile płacę? плюс kartą / gotówką
      (творительный в этой формуле).
pan_pani:
  summary_ru: >
    К баристе-незнакомцу по умолчанию — pan/pani и вежливый заказ
    (Poproszę…, Czy jest…?). Форма ty и *Daj… — только с друзьями
    или после явного перехода на «ты».
  form: "Poproszę… · Czy mogę poprosić o…? · Ile pan / pani płaci? (от персонала)"
  examples_pl:
    - Poproszę kawę.
    - Czy jest herbata?
    - Kartą, proszę.
  counterexamples_pl:
    - "*Daj kawę." # резко к незнакомцу
    - "*Możno mnie latte?" # калька «можно мне»
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      «Дайте / можна мені» → не *Daj / *Można mnie. У кавʼярні —
      Poproszę + biernik; до баристи pan/pani, не ty.
    rus: >
      «Можно мне кофе» часто даёт *Możno mnie kawę. По-польски —
      Poproszę kawę. Не говорите ty баристе-незнакомцу; kartą —
      творительный в формуле оплаты, не «на карте».
    bel: >
      «Дайце кавы» не робіць рэзкі *Daj. Poproszę… + pan/pani —
      асобны сэрвісны рэгістр; бел. «вы» ≠ wy + 2 л. мн. да бара.
grammar_points:
  - id: GP-A1-WK-POPROSZE-ACC
    title_pl: Poproszę + Biernik
    summary_ru: >
      Заказ: Poproszę + объект в винительном (kawę, herbatę, bułkę).
    form: >
      Poproszę + Acc (kawę, herbatę, kanapkę). Уточнение: dużą / małą.
      Оплата: kartą / gotówką (Narzędnik в формуле).
    meaning: >
      Вежливо назвать выбор и спокойно закрыть оплату.
    use: >
      Стойка кофейни, простой заказ без разговора про аллергии; затем
      Ile płacę? / Kartą, proszę.
    examples_pl:
      - Poproszę kawę latte.
      - Poproszę herbatę.
      - Kartą, proszę.
    counterexamples_pl:
      - "*Poproszę kawa." # без Acc
      - "*Daj mi latte." # неверный регистр
      - "*Płacę karta." # без Ins
    concept_ids:
      - GR-CAS-ACC-01
      - GR-NUM-MONEY-01
    l1_notes:
      ukr: >
        Після Poproszę — Acc (kawę), не *kawa. Kartą (Ins оплати)
        ≠ укр. «картою / на карту».
      rus: >
        «Кофе» после Poproszę → kawę (Acc), не *kawa. Оплата: kartą,
        не *na karte / *karta.
      bel: >
        Acc пасля Poproszę; аканне ў назвах напояў на пісьме не пераносіце.
        Kartą — цэлая формула, не з «картай».
l1_notes:
  ukr: >
    Не калькуйте «дайте / можна мені». Тримайте Poproszę + Acc,
    Czy jest…?, Kartą, proszę; з персоналом — pan/pani, не ty.
  rus: >
    Заказ без кальки «можно мне» и без ty к баристе. Запомните Acc после
    Poproszę и творительный в kartą / gotówką; цену слушайте целиком:
    Ile płacę?
  bel: >
    Не спадзявайцеся на «і так зразумеюць». Poproszę… / Czy jest… /
    Kartą, proszę — асобныя польскія рамкі; пісьмо без акання ў напоях.
