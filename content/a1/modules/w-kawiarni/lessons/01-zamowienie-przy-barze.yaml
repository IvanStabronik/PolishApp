dialogue:
  title_pl: Kawa przy barze
  turns:
    - speaker: Barista
      text_pl: Dzień dobry. W czym mogę pomóc?
    - speaker: Iryna
      text_pl: Dzień dobry. Poproszę kawę latte.
    - speaker: Barista
      text_pl: Dużą czy małą?
    - speaker: Iryna
      text_pl: Dużą, proszę. Czy jest też herbata?
    - speaker: Barista
      text_pl: Tak, jest. Coś jeszcze?
    - speaker: Iryna
      text_pl: Nie, to wszystko. Ile płacę?
    - speaker: Barista
      text_pl: Osiemnaście złotych. Kartą czy gotówką?
    - speaker: Iryna
      text_pl: Kartą, proszę. Dziękuję.
    - speaker: Barista
      text_pl: Proszę bardzo. Miłego dnia!
    - speaker: Iryna
      text_pl: Wzajemnie. Do widzenia.
key_lines:
  - text_pl: Poproszę kawę latte.
    explanation_ru: >
      Базовая рамка заказа: Poproszę + винительный (Biernik). Не калькируйте
      «дайте мне» как резкое *Daj mi… к незнакомцу за стойкой.
  - text_pl: Dużą czy małą?
    explanation_ru: >
      Уточнение размера; ответ часто повторяет форму прилагательного
      (Dużą, proszę) в согласовании с подразумеваемым существительным.
  - text_pl: Czy jest też herbata?
    explanation_ru: >
      Вопрос о наличии: Czy jest…? — безопасный A1-шаблон для меню/стойки.
  - text_pl: Ile płacę? / Kartą, proszę.
    explanation_ru: >
      Цена и способ оплаты: Ile płacę? + kartą / gotówką (творительный в формуле оплаты).
pan_pani:
  summary_ru: >
    К баристе-незнакомцу по умолчанию — pan/pani и вежливые формулы заказа
    (Poproszę…, Czy jest…?). Форма ty и *Daj… уместны только с друзьями
    или после явного перехода на «ты».
  form: "Poproszę… · Czy mogę poprosić o…? · Ile pan / pani płaci? (от персонала)"
  examples_pl:
    - Poproszę kawę.
    - Czy jest herbata?
    - Kartą, proszę.
  counterexamples_pl:
    - "*Daj kawę." # резко к незнакомцу
    - "*Możno mnie latte?" # калька «можно мне»
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      Українське «дайте / можна мені» не переносьте як *Daj / *Można mnie.
      У кавʼярні тримайте Poproszę + biernik і pan/pani до персоналу;
      «ти» лише якщо бариста сам запропонував.
    rus: >
      «Можно мне кофе» часто даёт *Możno mnie kawę. Польская рамка —
      Poproszę kawę. Не используйте ty к баристе-незнакомцу; kartą —
      творительный в формуле оплаты, не «на карте».
    bel: >
      Не калькуйце «дайце кавы» ў рэзкі *Daj. Poproszę… + pan/pani —
      асобны польскі сэрвісны рэгістр; не спадзявайцеся на бел. «вы»
      як wy + 2 л. мн. да бара.
grammar_points:
  - id: GP-A1-WK-POPROSZE-ACC
    title_pl: Poproszę + Biernik
    summary_ru: >
      Заказ позиции: Poproszę + объект в винительном (kawę, herbatę, bułkę).
    form: >
      Poproszę + Acc (kawę, herbatę, kanapkę). Uściślenie: dużą / małą.
      Płatność: kartą / gotówką (Narzędnik w formule).
    meaning: >
      Вежливо назвать выбор и закрыть платёжный слот транзакции.
    use: >
      Стойка кофейни, простой заказ без аллерго-консультации; затем
      Ile płacę? / Kartą, proszę.
    examples_pl:
      - Poproszę kawę latte.
      - Poproszę herbatę.
      - Kartą, proszę.
    counterexamples_pl:
      - "*Poproszę kawa." # без Acc
      - "*Daj mi latte." # неверный регистр
      - "*Płacę karta." # без Ins
    concept_ids:
      - GR-CAS-ACC-01
      - GR-NUM-MONEY-01
    l1_notes:
      ukr: >
        Не лишайте називний (*kawa) після Poproszę. «Кавою / картою» —
        не плутайте з польським kartą (Ins оплати).
      rus: >
        «Кофе» после Poproszę → kawę (Acc), не *kawa. Оплата: kartą,
        не *na karte / *karta.
      bel: >
        Трымайце Acc пасля Poproszę; аканне ў назвах напояў на пісьме
        не пераносіце. Kartą — цэлая формула, не збірайце з бел. «картай».
l1_notes:
  ukr: >
    Урок про замовлення в кавʼярні: Poproszę + biernik, питання Czy jest…?,
    оплата kartą/gotówką. Не калькуйте «дайте / можна мені»; pan/pani до
    персоналу обовʼязковий на першому контакті.
  rus: >
    Фокус: заказ без кальки «можно мне» и без ty к баристе. Запомните
    Acc после Poproszę и творительный в kartą / gotówką; числа цены
    слушайте как целый слот Ile płacę?
  bel: >
    Асобны акцэнт BEL: не капіюйце рускія нотаткі і не спадзявайцеся на
    «і так зразумеюць». Poproszę… / Czy jest… / Kartą, proszę — асобныя
    польскія рамкі; пісьмо без акання ў назвах напояў.
