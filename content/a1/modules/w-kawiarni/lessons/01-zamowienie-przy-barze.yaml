slug: zamowienie-przy-barze
version: 4
status: DRAFT
title_pl: Zamówienie przy barze
sort_order: 1
situation_ru: >
  Вы у стойки в небольшой кофейне в Польше. Нужен кофе или чай: размер,
  есть ли ещё что-то в меню, оплата. Бариста — взрослый незнакомец;
  речь спокойная, темы простые.
objective_ru: >
  Поздороваться, заказать (Poproszę…), спросить о наличии, оплатить
  и поблагодарить — на pan/pani, не на ty.
