dialogue:
  title_pl: Samodzielne zamówienie
  turns:
    - speaker: Barista
      text_pl: Dzień dobry.
    - speaker: Alina
      text_pl: Dzień dobry. Poproszę herbatę i kanapkę.
    - speaker: Barista
      text_pl: Kanapka z serem czy z szynką?
    - speaker: Alina
      text_pl: Z serem, proszę. Czy jest sok jabłkowy?
    - speaker: Barista
      text_pl: Tak, jest.
    - speaker: Alina
      text_pl: To poproszę też sok. Ile płacę?
    - speaker: Barista
      text_pl: Trzydzieści złotych. Kartą czy gotówką?
    - speaker: Alina
      text_pl: Kartą. Dziękuję, do widzenia.
key_lines:
  - text_pl: Poproszę herbatę i kanapkę.
    explanation_ru: Две позиции можно соединить союзом i.
  - text_pl: Czy jest sok jabłkowy?
    explanation_ru: Самостоятельная проверка наличия.
  - text_pl: To poproszę też sok.
    explanation_ru: Добавление позиции после ответа.
  - text_pl: Dziękuję, do widzenia.
    explanation_ru: Вежливое закрытие транзакции.
pan_pani:
  summary_ru: С незнакомым взрослым собеседником сохраняйте pan/pani и третье лицо; нейтральные
    просьбы и благодарность важнее буквального переноса форм L1.
  form: Poproszę… · Czy jest…? · Ile płacę? · Dziękuję
  examples_pl: &a1
    - Poproszę herbatę i kanapkę.
    - Czy jest sok?
    - To poproszę też sok.
  counterexamples_pl:
    - "*Ty mi powiedz."
    - "*Daj mi to."
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: Відпрацьовуйте польську рамку «Poproszę… · Czy jest…? · Ile płacę? · Dziękuję» цілісно; не
      складайте її дослівно з українських слів.
    rus: Отрабатывайте польскую рамку «Poproszę… · Czy jest…? · Ile płacę? · Dziękuję» целиком, без
      дословной кальки с русского.
    bel: Адпрацоўвайце польскую рамку «Poproszę… · Czy jest…? · Ile płacę? · Dziękuję» цалкам; не
      складайце яе даслоўна з беларускай.
