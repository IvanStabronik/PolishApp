    - GR-NUM-MONEY-01
    - PRAG-PAN-01
dialogue:
  title_pl: Samodzielne zamówienie
  turns:
    - speaker: Barista
      text_pl: Dzień dobry.
    - speaker: Alina
      text_pl: Dzień dobry. Poproszę herbatę i kanapkę.
    - speaker: Barista
      text_pl: Kanapka z serem czy z szynką?
    - speaker: Alina
      text_pl: Z serem, proszę. Czy jest sok jabłkowy?
    - speaker: Barista
      text_pl: Tak, jest.
    - speaker: Alina
      text_pl: To poproszę też sok. Ile płacę?
    - speaker: Barista
      text_pl: Trzydzieści złotych. Kartą czy gotówką?
    - speaker: Alina
      text_pl: Kartą. Dziękuję, do widzenia.
key_lines:
  - text_pl: Poproszę herbatę i kanapkę.
    explanation_ru: >
      Две позиции в одном заказе: Poproszę + Acc + i + Acc.
  - text_pl: Czy jest sok jabłkowy?
    explanation_ru: >
      Сами спрашиваете о наличии: Czy jest…? — тот же шаблон, что у стойки.
  - text_pl: To poproszę też sok.
    explanation_ru: >
      После «Tak, jest» — спокойно добавить позицию: To poproszę też…
  - text_pl: Dziękuję, do widzenia.
    explanation_ru: >
      Закрыть контакт: благодарность и прощание после оплаты.
pan_pani:
  summary_ru: >
    К баристе-незнакомцу — pan/pani и спокойные формулы
    (Poproszę…, Czy jest…?, Ile płacę?, Kartą). Не переходите на ty
    и не собирайте заказ из *Daj… у стойки.
  form: Poproszę… · Czy jest…? · Ile płacę? · Dziękuję
  examples_pl: &a1
    - Poproszę herbatę i kanapkę.
    - Czy jest sok?
    - To poproszę też sok.
  counterexamples_pl:
    - "*Daj herbatę i kanapkę." # резко
    - "*Możno mnie też sok?" # калька «можно мне ещё»
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      Не збирайте заказ з «дайте / можна мені». Тримайте
      Poproszę… → Czy jest…? → Ile płacę? → Dziękuję; «ти» до баристи —
      лише якщо сам запропонував.
    rus: >
      Держите рамку Poproszę… / Czy jest…? / Ile płacę? / Dziękuję целиком.
      Не собирайте заказ из «дайте / можно мне»; ty к баристе — только если
      он сам предложил.
    bel: >
      Не збірайце заказ з «дайце / можна мне». Трымайце
      Poproszę… → Czy jest…? → Ile płacę? → Dziękuję; да барысты не ty,
      пакуль ён сам не прапануе.
grammar_points:
  - id: GP-A1-WK-L3
    title_pl: Pełna transakcja w kawiarni
    summary_ru: >
      Собрать знакомые реплики в один заказ: две позиции, наличие,
      добавка, цена и оплата.
    form: Poproszę X i Y. Czy jest Z? To poproszę też Z. Ile płacę?
    meaning: >
      Бариста понимает полный выбор и как вы платите — без лишних слов.
    use: >
      Когда у стойки нужны напиток и еда, плюс вопрос о наличии и закрытие
      оплаты в одной короткой сцене.
    examples_pl: *a1
    counterexamples_pl:
      - "*Poproszę herbata i kanapka." # без Acc
      - "*Ja chcę jeszcze sok." # калька вместо To poproszę też…
    concept_ids:
      - GR-CAS-ACC-01
      - GR-PRO-DEM-01
      - GR-NUM-MONEY-01
    l1_notes:
      ukr: >
        Після Poproszę — Acc (herbatę, kanapkę). Czy jest…? і
        To poproszę też… цілими; не «можна мені ще».
      rus: >
        После Poproszę — Acc (herbatę, kanapkę), не именительный. Czy jest…?
        и To poproszę też… — целые формулы, не калька «можно мне ещё».
      bel: >
        Acc пасля Poproszę. Czy jest…? / To poproszę też… вучыце цэлымі;
        не калька «можна мне яшчэ».
l1_notes:
  ukr: >
    Самі: Poproszę X i Y, Czy jest…?, To poproszę też…, ціна й Kartą.
    Без «дайте» і без ty до персоналу.
  rus: >
    Сами: две позиции (Poproszę X i Y), Czy jest…?, To poproszę też…,
    цена и Kartą. Без кальки «дайте» и без ty к баристе.
  bel: >
    Самі правядзіце заказ цэлымі рамкамі: Poproszę X i Y / Czy jest…? /
    To poproszę też… / Kartą. Без калькі «дайце» і без ty да бара.
