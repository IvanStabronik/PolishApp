kind: lesson
canonical_id: LES-A1-WK-03
slug: samodzielne-zamowienie
version: 2
status: DRAFT
title_pl: Samodzielne zamówienie
sort_order: 3
situation_ru: >
  Вы у стойки одни: нужен напиток и еда, возможно ещё что-то из меню,
  потом цена и оплата. Бариста — взрослый незнакомец; речь спокойная,
  без подсказок из прошлых шагов.
objective_ru: >
  Самим провести короткий заказ: две позиции через Poproszę… i…,
  спросить о наличии, добавить позицию, оплатить и поблагодарить —
  на pan/pani.
curriculum_links:
  scenarios:
    - SCN-A1-FOOD-01
  functions:
    - FN-A1-TRANS-01
    - FN-A1-ASK-01
    - FN-A1-ADDRESS-01
    - FN-A1-QUANT-01
    - FN-A1-THANKS-01
  lex_bundles:
    - LEX-A1-SERVICE
    - LEX-A1-MONEY
  concepts:
    - GR-CAS-ACC-01
    - GR-PRO-DEM-01
    - GR-NUM-MONEY-01
    - PRAG-PAN-01
dialogue:
  title_pl: Samodzielne zamówienie
  turns:
    - speaker: Barista
      text_pl: Dzień dobry.
    - speaker: Alina
      text_pl: Dzień dobry. Poproszę herbatę i kanapkę.
    - speaker: Barista
      text_pl: Kanapka z serem czy z szynką?
    - speaker: Alina
      text_pl: Z serem, proszę. Czy jest sok jabłkowy?
    - speaker: Barista
      text_pl: Tak, jest.
    - speaker: Alina
      text_pl: To poproszę też sok. Ile płacę?
    - speaker: Barista
      text_pl: Trzydzieści złotych. Kartą czy gotówką?
    - speaker: Alina
      text_pl: Kartą. Dziękuję, do widzenia.
key_lines:
  - text_pl: Poproszę herbatę i kanapkę.
    explanation_ru: >
      Две позиции в одном заказе: Poproszę + Acc + i + Acc.
  - text_pl: Czy jest sok jabłkowy?
    explanation_ru: >
      Сами спрашиваете о наличии: Czy jest…? — тот же шаблон, что у стойки.
  - text_pl: To poproszę też sok.
    explanation_ru: >
      После «Tak, jest» — спокойно добавить позицию: To poproszę też…
  - text_pl: Dziękuję, do widzenia.
    explanation_ru: >
      Закрыть контакт: благодарность и прощание после оплаты.
pan_pani:
  summary_ru: >
    К баристе-незнакомцу — pan/pani и спокойные формулы
    (Poproszę…, Czy jest…?, Ile płacę?, Kartą). Не переходите на ty
    и не собирайте заказ из *Daj… у стойки.
  form: Poproszę… · Czy jest…? · Ile płacę? · Dziękuję
  examples_pl: &a1
    - Poproszę herbatę i kanapkę.
    - Czy jest sok?
    - To poproszę też sok.
  counterexamples_pl:
    - "*Ty mi powiedz."
    - "*Daj mi to."
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      Тримайте рамку Poproszę… / Czy jest…? / Ile płacę? / Dziękuję цілою.
      Не збирайте заказ з «дайте / можна мені»; «ти» до баристи лише якщо
      він сам запропонував.
    rus: >
      Держите рамку Poproszę… / Czy jest…? / Ile płacę? / Dziękuję целиком.
      Не собирайте заказ из «дайте / можно мне»; ty к баристе — только если
      он сам предложил.
    bel: >
      Трымайце рамку Poproszę… / Czy jest…? / Ile płacę? / Dziękuję цэлай.
      Не збірайце заказ з «дайце / можна мне»; «ты» да барысты толькі калі
      ён сам прапанаваў.
grammar_points:
  - id: GP-A1-WK-L3
    title_pl: Pełna transakcja w kawiarni
    summary_ru: >
      Собрать знакомые реплики в один заказ: две позиции, наличие,
      добавка, цена и оплата.
    form: Poproszę X i Y. Czy jest Z? To poproszę też Z. Ile płacę?
    meaning: >
      Бариста понимает полный выбор и как вы платите — без лишних слов.
    use: >
      Когда у стойки нужны напиток и еда, плюс вопрос о наличии и закрытие
      оплаты в одной короткой сцене.
    examples_pl: *a1
    counterexamples_pl:
      - "*Ty daj."
      - "*Ja nie rozumieć."
    concept_ids:
      - GR-CAS-ACC-01
      - GR-PRO-DEM-01
      - GR-NUM-MONEY-01
    l1_notes:
      ukr: >
        Після Poproszę — Acc (herbatę, kanapkę), не називний. Czy jest…?
        і To poproszę też… тримайте цілими; не калькуйте «можна мені ще».
      rus: >
        После Poproszę — Acc (herbatę, kanapkę), не именительный. Czy jest…?
        и To poproszę też… — целые формулы, не калька «можно мне ещё».
      bel: >
        Пасля Poproszę — Acc (herbatę, kanapkę), не назоўны. Czy jest…?
        і To poproszę też… трымайце цэлымі; не калькуйце «можна мне яшчэ».
l1_notes:
  ukr: >
    Урок про повний заказ у кавʼярні: дві позиції (Poproszę X i Y),
    Czy jest…?, To poproszę też…, ціна й Kartą. Без кальки «дайте»
    і без ty до персоналу.
  rus: >
    Урок про полный заказ в кофейне: две позиции (Poproszę X i Y),
    Czy jest…?, To poproszę też…, цена и Kartą. Без кальки «дайте»
    и без ty к баристе.
  bel: >
    Асобны акцэнт BEL: не капіюйце рускія нотаткі. Poproszę X i Y /
    Czy jest…? / To poproszę też… / Kartą — асобныя польскія рамкі
    ў кавярні.
