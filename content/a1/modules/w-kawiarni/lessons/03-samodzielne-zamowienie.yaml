kind: lesson
canonical_id: LES-A1-WK-03
slug: samodzielne-zamowienie
version: 6
status: DRAFT
title_pl: Samodzielne zamówienie
sort_order: 3
situation_ru: >
  Вы у стойки одни: напиток и еда, возможно ещё что-то из меню,
  потом цена и оплата. Бариста — взрослый незнакомец; без подсказок
  из прошлых шагов и без *Daj / ty.
objective_ru: >
  Сами провести короткий заказ: две позиции через Poproszę… i…,
  спросить Czy jest…?, добавить To poproszę też…, оплатить и поблагодарить —
  на pan/pani.
