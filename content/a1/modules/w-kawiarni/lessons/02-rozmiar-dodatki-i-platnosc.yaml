    - LEX-A1-MONEY
  concepts:
    - GR-CAS-ACC-01
    - GR-PRO-DEM-01
    - GR-NUM-MONEY-01
    - PRAG-PAN-01
dialogue:
  title_pl: Rozmiar, dodatki i płatność
  turns:
    - speaker: Baristka
      text_pl: Dzień dobry. Co podać?
    - speaker: Maksym
      text_pl: Poproszę dużą kawę.
    - speaker: Baristka
      text_pl: Z mlekiem czy bez mleka?
    - speaker: Maksym
      text_pl: Z mlekiem, proszę. I małą herbatę.
    - speaker: Baristka
      text_pl: Czy to wszystko?
    - speaker: Maksym
      text_pl: Tak, to wszystko. Ile płacę?
    - speaker: Baristka
      text_pl: Dwadzieścia dwa złote.
    - speaker: Maksym
      text_pl: Kartą, proszę. Dziękuję.
key_lines:
  - text_pl: Poproszę dużą kawę.
    explanation_ru: >
      Размер в том же падеже, что и напиток: dużą kawę (Acc) после Poproszę.
  - text_pl: Z mlekiem, proszę.
    explanation_ru: >
      Короткий ответ на вопрос о добавке: z mlekiem / bez mleka + proszę.
  - text_pl: Tak, to wszystko.
    explanation_ru: >
      «Да, это всё» — спокойно закрыть выбор перед ценой.
  - text_pl: Kartą, proszę.
    explanation_ru: >
      Способ оплаты: kartą / gotówką (творительный в этой формуле).
pan_pani:
  summary_ru: >
    К баристе-незнакомцу — pan/pani и спокойные формулы заказа
    (Poproszę…, Z mlekiem, proszę, Kartą, proszę). Не переходите на ty
    и не говорите *Daj… у стойки.
  form: "małą / dużą · z mlekiem · to wszystko · kartą"
  examples_pl: &a1
    - Poproszę dużą kawę.
    - Z mlekiem, proszę.
    - Kartą, proszę.
  counterexamples_pl:
    - "*Ty mi powiedz."
    - "*Daj mi to."
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: >
      «Дайте / можна мені» не збирає заказ. Тримайте małą/dużą + Acc,
      z mlekiem і Kartą, proszę; «ти» до баристи — лише якщо сам запропонував.
    rus: >
      Не собирайте заказ из «дайте / можно мне». Нужны małą/dużą + Acc,
      z mlekiem и Kartą, proszę целиком; ty к баристе — только если он сам
      предложил.
    bel: >
      Не з «дайце / можна мне». Małą/dużą + Acc, z mlekiem і Kartą, proszę —
      вучыце цэлымі; да барысты не ty, пакуль ён сам не прапануе.
grammar_points:
  - id: GP-A1-WK-L2
    title_pl: Rozwinięcie zamówienia
    summary_ru: >
      К заказу добавить размер и добавку, закрыть to wszystko и оплатить.
    form: >
      Poproszę + rozmiar + produkt (Acc). Z/bez + dodatek. Kartą / gotówką.
    meaning: >
      Бариста понимает размер, добавку и как вы платите.
    use: >
      После базового Poproszę… у стойки: ответить на уточнения, затем
      Ile płacę? / Kartą, proszę.
    examples_pl: *a1
    counterexamples_pl:
      - "*Ty daj."
      - "*Ja nie rozumieć."
    concept_ids:
      - GR-CAS-ACC-01
      - GR-PRO-DEM-01
      - GR-NUM-MONEY-01
    l1_notes:
      ukr: >
        Після Poproszę — Acc (dużą kawę), не називний. Z mlekiem /
        bez mleka і kartą — цілі формули, не «з молоком / на карту».
      rus: >
        После Poproszę — Acc (dużą kawę), не именительный. Z mlekiem /
        bez mleka и kartą — целые формулы, не калька «с молоком / на карту».
      bel: >
        Acc пасля Poproszę (dużą kawę). Z mlekiem / bez mleka і kartą —
        цэлыя; не збірайце з «з малаком / на карту».
l1_notes:
  ukr: >
    Розмір (dużą/małą), добавка (z mlekiem), Tak, to wszystko і Kartą.
    Без кальки «дайте»; pan/pani до персоналу.
  rus: >
    Размер (dużą/małą), добавка (z mlekiem), Tak, to wszystko и kartą.
    Без кальки «дайте» и без ty к баристе.
  bel: >
    Dużą kawę / z mlekiem / to wszystko / Kartą, proszę — асобныя рамкі.
    Не спадзявайцеся на кальку «дайце»; да бара — не ty.
