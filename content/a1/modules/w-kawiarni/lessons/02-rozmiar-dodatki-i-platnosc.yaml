dialogue:
  title_pl: Rozmiar, dodatki i płatność
  turns:
    - speaker: Baristka
      text_pl: Dzień dobry. Co podać?
    - speaker: Maksym
      text_pl: Poproszę dużą kawę.
    - speaker: Baristka
      text_pl: Z mlekiem czy bez mleka?
    - speaker: Maksym
      text_pl: Z mlekiem, proszę. I małą herbatę.
    - speaker: Baristka
      text_pl: Czy to wszystko?
    - speaker: Maksym
      text_pl: Tak, to wszystko. Ile płacę?
    - speaker: Baristka
      text_pl: Dwadzieścia dwa złote.
    - speaker: Maksym
      text_pl: Kartą, proszę. Dziękuję.
key_lines:
  - text_pl: Poproszę dużą kawę.
    explanation_ru: Размер согласуется с kawę в рамке заказа.
  - text_pl: Z mlekiem, proszę.
    explanation_ru: Короткий ответ на вопрос о добавке.
  - text_pl: Tak, to wszystko.
    explanation_ru: Подтверждение, что заказ завершён.
  - text_pl: Kartą, proszę.
    explanation_ru: Указание способа оплаты.
pan_pani:
  summary_ru: С незнакомым взрослым собеседником сохраняйте pan/pani и третье лицо; нейтральные
    просьбы и благодарность важнее буквального переноса форм L1.
  form: małą/dużą · z mlekiem · to wszystko · kartą
  examples_pl: &a1
    - Poproszę dużą kawę.
    - Z mlekiem, proszę.
    - Kartą, proszę.
  counterexamples_pl:
    - "*Ty mi powiedz."
    - "*Daj mi to."
  concept_ids:
    - PRAG-PAN-01
  l1_notes:
    ukr: Відпрацьовуйте польську рамку «małą/dużą · z mlekiem · to wszystko · kartą» цілісно; не
      складайте її дослівно з українських слів.
    rus: Отрабатывайте польскую рамку «małą/dużą · z mlekiem · to wszystko · kartą» целиком, без
      дословной кальки с русского.
    bel: Адпрацоўвайце польскую рамку «małą/dużą · z mlekiem · to wszystko · kartą» цалкам; не складайце
      яе даслоўна з беларускай.
