slug: rozmiar-dodatki-i-platnosc
version: 4
status: DRAFT
title_pl: Rozmiar, dodatki i płatność
sort_order: 2
situation_ru: >
  Заказ уже начат у стойки. Бариста уточняет размер и добавку;
  вы отвечаете коротко, закрываете заказ и платите.
objective_ru: >
  Назвать размер (dużą / małą), ответить на z mlekiem / bez mleka,
  сказать Tak, to wszystko и оплатить kartą — на pan/pani.
