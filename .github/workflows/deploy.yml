name: Deploy private beta

# M5 — deployment workflow. Automatic production deploy is DISABLED until
# Vercel (or legacy) credentials + environment protection exist.
# Primary path: Vercel Git integration + Neon/Supabase Postgres (env in Vercel dashboard).
# This workflow is optional when Git integration auto-deploys; use it for
# migrate + deploy-hook + health/smoke gates.
# Operators run this manually via workflow_dispatch after secrets are configured.

on:
  workflow_dispatch:
    inputs:
      confirm_environment:
        description: "Type 'private-beta' to confirm"
        required: true
        type: string
      image_tag:
        description: "Git SHA or ref to deploy / verify"
        required: true
        type: string
      run_production_smoke:
        description: "Run Playwright production smoke after health checks"
        required: true
        type: boolean
        default: true

concurrency:
  group: deploy-private-beta
  cancel-in-progress: false

jobs:
  guard:
    name: Guardrails
    runs-on: ubuntu-latest
    # Must use the same Environment as migrate/deploy so environment-scoped
    # secrets are visible (repo-level empty checks always fail closed otherwise).
    environment: private-beta
    steps:
      - name: Confirm intent
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_environment }}" != "private-beta" ]; then
            echo "Refusing deploy: confirm_environment must be 'private-beta'"
            exit 1
          fi
          if [ -z "${{ secrets.DATABASE_URL }}" ] || [ -z "${{ secrets.BETTER_AUTH_SECRET }}" ]; then
            echo "EXTERNAL ACCESS REQUIRED: DATABASE_URL / BETTER_AUTH_SECRET secrets missing"
            echo "Configure GitHub Environment 'private-beta' secrets (or set app env in Vercel and skip this workflow)."
            exit 1
          fi
          # Primary: Vercel deploy hook OR Vercel CLI token trio.
          # Legacy: generic DEPLOY_WEBHOOK_URL or Railway (secondary).
          HAS_VERCEL_HOOK=0
          HAS_VERCEL_CLI=0
          HAS_LEGACY=0
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            HAS_VERCEL_HOOK=1
          fi
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            HAS_VERCEL_CLI=1
          fi
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ] || [ -n "${{ secrets.RAILWAY_TOKEN }}" ]; then
            HAS_LEGACY=1
          fi
          if [ "$HAS_VERCEL_HOOK" -eq 0 ] && [ "$HAS_VERCEL_CLI" -eq 0 ] && [ "$HAS_LEGACY" -eq 0 ]; then
            echo "EXTERNAL ACCESS REQUIRED: no Vercel or legacy deploy transport"
            echo "Prefer: VERCEL_DEPLOY_HOOK_URL, or VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID"
            echo "Or use Vercel Git integration (dashboard) and skip workflow deploy — still need migrate + BASE_URL for verify."
            echo "Legacy (optional): DEPLOY_WEBHOOK_URL or RAILWAY_TOKEN + RAILWAY_SERVICE_ID"
            exit 1
          fi
          if [ -n "${{ secrets.RAILWAY_TOKEN }}" ] && [ -z "${{ secrets.RAILWAY_SERVICE_ID }}" ]; then
            echo "EXTERNAL ACCESS REQUIRED: RAILWAY_TOKEN without RAILWAY_SERVICE_ID (legacy)"
            exit 1
          fi
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            if [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
              echo "EXTERNAL ACCESS REQUIRED: VERCEL_TOKEN without VERCEL_ORG_ID / VERCEL_PROJECT_ID"
              exit 1
            fi
          fi

  migrate:
    name: Migration gate
    needs: guard
    runs-on: ubuntu-latest
    environment: private-beta
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations (advisory lock)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
      - name: On failure — rollback instructions
        if: failure()
        run: |
          echo "::error::Migration failed — STOP deploy. Restore pre-migrate dump if schema half-applied. Redeploy previous app image. See docs/operations/release-and-rollback.md"

  deploy:
    name: Deploy (Vercel primary / legacy optional)
    needs: migrate
    runs-on: ubuntu-latest
    environment: private-beta
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}
      - name: Trigger provider deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # 1) Preferred: Vercel Deploy Hook (Git integration already linked)
          if [ -n "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
            echo "Vercel deploy hook invoked for $IMAGE_TAG"
            exit 0
          fi
          # 2) Vercel CLI from monorepo root (vercel.json + VERCEL_* env)
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            if [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
              echo "EXTERNAL ACCESS REQUIRED: VERCEL_TOKEN set but VERCEL_ORG_ID / VERCEL_PROJECT_ID missing"
              exit 1
            fi
            npm i -g vercel@41
            # VERCEL_ORG_ID + VERCEL_PROJECT_ID in env skip interactive link.
            vercel deploy --prod --yes --token "$VERCEL_TOKEN"
            echo "Vercel CLI production deploy requested (ref=$IMAGE_TAG)"
            exit 0
          fi
          # 3) Generic webhook
          if [ -n "${DEPLOY_WEBHOOK_URL:-}" ]; then
            curl -fsS -X POST "$DEPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"tag\":\"$IMAGE_TAG\",\"service\":\"slowarium-web\"}"
            echo "Deploy webhook invoked for $IMAGE_TAG"
            exit 0
          fi
          # 4) Legacy Railway (secondary / optional)
          if [ -n "${RAILWAY_TOKEN:-}" ]; then
            SERVICE_ID="${{ secrets.RAILWAY_SERVICE_ID }}"
            if [ -z "${SERVICE_ID:-}" ]; then
              echo "EXTERNAL ACCESS REQUIRED: RAILWAY_TOKEN set but RAILWAY_SERVICE_ID missing"
              exit 1
            fi
            curl -fsSL https://railway.com/install.sh | sh
            export PATH="$HOME/.railway/bin:$PATH"
            railway redeploy --service "$SERVICE_ID" --yes
            echo "Railway redeploy requested for $SERVICE_ID (ref=$IMAGE_TAG) — legacy path"
            exit 0
          fi
          echo "No deploy transport configured"
          exit 1

  verify:
    name: Health + production smoke
    needs: deploy
    runs-on: ubuntu-latest
    environment: private-beta
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Wait for health/ready
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ]; then
            echo "EXTERNAL ACCESS REQUIRED: BASE_URL secret missing"
            exit 1
          fi
          for i in $(seq 1 30); do
            if curl -fsS "$BASE_URL/api/health" >/dev/null && curl -fsS "$BASE_URL/api/ready" >/dev/null; then
              echo "Healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health/ready failed — rollback previous deploy. See docs/operations/release-and-rollback.md"
          exit 1
      - name: Production smoke
        if: ${{ inputs.run_production_smoke }}
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          PROD_SMOKE_ADMIN_EMAIL: ${{ secrets.PROD_SMOKE_ADMIN_EMAIL }}
          PROD_SMOKE_ADMIN_PASSWORD: ${{ secrets.PROD_SMOKE_ADMIN_PASSWORD }}
          PROD_SMOKE_ALLOW_DESTRUCTIVE: ${{ secrets.PROD_SMOKE_ALLOW_DESTRUCTIVE }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e:production
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-artifacts
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
