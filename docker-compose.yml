services:
  postgres:
    image: postgres:16
    container_name: slowarium-postgres
    restart: unless-stopped
    ports:
      # Host 5433 avoids clash with a local Postgres already on 5432.
      - "5433:5432"
    environment:
      POSTGRES_USER: slowarium
      POSTGRES_PASSWORD: slowarium
      POSTGRES_DB: slowarium
    volumes:
      - slowarium_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slowarium -d slowarium"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  slowarium_pg_data:
